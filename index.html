<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1B16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Ledger — INR · Step 6J</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1B16;
    --panel: #152420;
    --panel-2: #0C1512;
    --line: #26382F;
    --line-soft: #1D2C25;
    --text: #E9F1EC;
    --text-muted: #85988D;
    --text-dim: #5B6D62;
    --gold: #C9A24B;
    --mint: #6FCF97;
    --red: #E0554F;
    --chip-bg: #1B2B23;
    --chip-hover: #24382D;
    --radius-sm: 3px;
    --radius-md: 6px;
    font-size: 16px;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .num{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand-mark{
    width:9px; height:9px;
    background: var(--gold);
    display:inline-block;
    border-radius: 1px;
    transform: rotate(45deg);
  }
  .brand-name{
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .install-btn{
    display:none;
    border:1px solid var(--line);
    background:var(--chip-bg);
    color:var(--text);
    border-radius:10px;
    padding:8px 11px;
    font:500 12px 'IBM Plex Sans',sans-serif;
    cursor:pointer;
  }
  .install-btn.show{display:inline-flex;align-items:center;gap:6px;}
  .offline-badge{
    display:none;
    font-size:11px;
    color:var(--text-muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 8px;
  }
  .offline-badge.show{display:inline-block;}
  @media (max-width:560px){
    header{padding:12px 14px;}
    .header-right{gap:7px;}
    .install-btn{padding:7px 9px;}
    .offline-badge{display:none !important;}
  }
  .balance-stat{
    text-align:right;
    line-height:1.15;
  }
  .balance-stat .amt{
    font-family:'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight:600;
  }
  .balance-stat .lbl{
    font-size: 11px;
    color: var(--text-muted);
    margin-top:2px;
  }
  .view-toggle{
    display:flex;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    overflow:hidden;
  }
  .view-toggle button{
    background: transparent;
    border:none;
    color: var(--text-muted);
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 7px 13px;
    cursor:pointer;
    transition: background 0.15s, color 0.15s;
  }
  .view-toggle button.active{
    background: var(--chip-hover);
    color: var(--text);
  }
  .view-toggle button:not(.active):hover{
    color: var(--text);
  }

  /* ---------- main area ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width: 640px;
    width:100%;
    margin: 0 auto;
    min-height:0;
  }

  /* ---------- chat view ---------- */
  #chat-view{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  #chat-log{
    flex:1;
    overflow-y:auto;
    padding: 22px 20px 10px 20px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .msg-row{
    display:flex;
    flex-direction:column;
    max-width: 82%;
  }
  .msg-row.bot{ align-self:flex-start; }
  .msg-row.user{ align-self:flex-end; align-items:flex-end; }

  .msg-sender{
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    padding: 0 2px;
  }
  .msg-row.user .msg-sender{ text-align:right; }

  .bubble{
    padding: 10px 13px;
    font-size: 14.5px;
    line-height:1.5;
    border-left: 2px solid var(--line);
    background: var(--panel);
  }
  .msg-row.bot .bubble{
    border-left-color: var(--gold);
  }
  .msg-row.user .bubble{
    border-left: none;
    border-right: 2px solid var(--mint);
    background: var(--panel);
  }
  .bubble .highlight-amt{
    font-family:'IBM Plex Mono', monospace;
    color: var(--mint);
  }
  .bubble .highlight-amt.neg{ color: var(--red); }

  .confirm-card{
    padding: 12px 14px;
    background: var(--panel);
    border: 1px dashed var(--line);
    font-size: 13.5px;
    line-height: 1.7;
  }
  .confirm-card .row{
    display:flex;
    justify-content:space-between;
    gap: 12px;
  }
  .confirm-card .row .k{ color: var(--text-muted); }
  .confirm-card .row .v{ font-family:'IBM Plex Mono', monospace; }

  /* choices */
  .choices{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 0 2px;
  }
  .chip{
    background: var(--chip-bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor:pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .chip:hover{
    background: var(--chip-hover);
    border-color: var(--gold);
  }
  .chip:active{ transform: scale(0.97); }
  .chip.chosen{
    background: var(--chip-hover);
    border-color: var(--text-dim);
    color: var(--text-dim);
    cursor:default;
  }
  .chip.danger:hover{ border-color: var(--red); }
  .chip.primary{
    border-color: var(--gold);
    color: var(--gold);
  }

  .back-chip{
    margin-top: 8px;
    color: var(--text-muted);
    border-color: var(--line);
  }
  .back-chip:hover{
    color: var(--text);
    border-color: var(--gold);
  }

  /* input row for amount / note */
  .input-row{
    display:flex;
    gap: 8px;
    margin-top: 10px;
    padding: 0 2px;
  }
  .input-row input{
    flex:1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: 'IBM Plex Mono', monospace;
    outline:none;
  }
  .input-row input:focus{ border-color: var(--gold); }
  .input-row input::placeholder{ color: var(--text-dim); font-family:'IBM Plex Sans', sans-serif; }
  /* date picker */
  .date-row{
    display:flex;
    gap:8px;
    margin-top:10px;
    padding:0 2px;
  }
  .date-row input[type="date"]{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 12px;
    border-radius:var(--radius-md);
    font-size:14px;
    font-family:'IBM Plex Mono', monospace;
    outline:none;
    color-scheme:dark;
  }
  .date-row input[type="date"]:focus{ border-color:var(--gold); }
  .date-row button.send{
    background:var(--gold);
    color:#14231C;
    border:none;
    padding:0 16px;
    border-radius:var(--radius-md);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .date-row button.send:hover{ opacity:.9; }
  .date-row button.send:disabled{ opacity:.4; cursor:default; }

  .input-row button.send{
    background: var(--gold);
    color: #14231C;
    border:none;
    padding: 0 16px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    font-weight:600;
    cursor:pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .input-row button.send:hover{ opacity:0.9; }
  .input-row button.send:disabled{ opacity:0.4; cursor:default; }

  .typing{
    display:flex;
    gap:4px;
    padding: 10px 13px;
    align-self:flex-start;
  }
  .typing span{
    width:5px; height:5px;
    background: var(--text-dim);
    border-radius:50%;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.2s; }
  .typing span:nth-child(3){ animation-delay: 0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  /* ---------- summary view ---------- */
  #summary-view{
    display:none;
    flex:1;
    overflow-y:auto;
    padding: 22px 20px 40px 20px;
  }
  .summary-section{ margin-bottom: 28px; }
  .summary-section h2{
    font-size: 13px;
    font-weight:600;
    color: var(--text-muted);
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .stat-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat-box{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 14px;
  }
  .stat-box .v{
    font-family:'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight:600;
  }
  .stat-box .v.income{ color: var(--mint); }
  .stat-box .v.expense{ color: var(--red); }
  .stat-box .l{
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .cat-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 9px;
    font-size: 13px;
  }
  .cat-row .cat-name{
    width: 120px;
    flex-shrink:0;
    color: var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cat-row .cat-bar-track{
    flex:1;
    height: 7px;
    background: var(--line-soft);
    border-radius: 4px;
    overflow:hidden;
  }
  .cat-row .cat-bar-fill{
    height:100%;
    background: var(--gold);
    border-radius: 4px;
  }
  .cat-row .cat-amt{
    width: 72px;
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    flex-shrink:0;
  }

  .txn-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13.5px;
  }
  .txn-item:last-child{ border-bottom:none; }
  .txn-main{ display:flex; flex-direction:column; gap:2px; }
  .txn-cat{ font-weight:500; }
  .txn-meta{ font-size: 11.5px; color: var(--text-dim); }
  .txn-right{ display:flex; align-items:center; gap: 10px; }
  .txn-amt{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .txn-amt.income{ color: var(--mint); }
  .txn-amt.expense{ color: var(--red); }
  .txn-del{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 15px;
    padding: 2px 4px;
    line-height:1;
  }
  .txn-del:hover{ color: var(--red); }

  .empty-note{
    color: var(--text-dim);
    font-size: 13px;
    padding: 6px 0;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  /* ---------- mobile / PWA polish ---------- */
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    overscroll-behavior-y: contain;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea{ -webkit-user-select: text; user-select: text; }
  button, input{ touch-action: manipulation; }
  @media (max-width: 640px){
    header{ padding: 14px 15px; }
    .header-right{ gap: 10px; }
    .balance-stat .amt{ font-size: 16px; }
    .view-toggle button{ padding: 8px 10px; }
    main{ max-width:none; }
    #chat-log{ padding: 16px 14px 12px; gap: 12px; }
    #summary-view{ padding: 16px 14px 30px; }
    .msg-row{ max-width: 92%; }
    .bubble{ font-size: 15px; padding: 11px 13px; }
    .choices{ gap: 7px; }
    .chip{ min-height: 42px; padding: 9px 13px; font-size: 14px; }
    .input-row{ gap: 7px; }
    .input-row input{
      min-width: 0;
      min-height: 44px;
      font-size: 16px;
    }
    .input-row button.send{ min-height: 44px; }
    .stat-grid{ grid-template-columns: 1fr; }
    .stat-box{ padding: 11px 13px; }
    .cat-row .cat-name{ width: 95px; }
  }
  @media (display-mode: standalone){
    header{ padding-top: max(14px, env(safe-area-inset-top)); }
    #summary-view{ padding-bottom: max(30px, env(safe-area-inset-bottom)); }
    #chat-log{ padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  }

  .data-actions{ display:flex; flex-wrap:wrap; gap:8px; }

  .memory-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 14px;
  }
  .memory-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .memory-row:last-child{ border-bottom:0; }
  .memory-name{ min-width:0; }
  .memory-edit{
    flex:0 0 auto; background:var(--chip-bg); border:1px solid var(--line);
    color:var(--text); border-radius:999px; padding:6px 10px; cursor:pointer;
  }
  .memory-edit:hover{ border-color:var(--gold); }
  .data-action{
    background:var(--chip-bg); border:1px solid var(--line); color:var(--text);
    padding:8px 12px; border-radius:var(--radius-md); cursor:pointer; font-size:13px;
  }
  .data-action:hover{ border-color:var(--gold); background:var(--chip-hover); }
  .data-action.danger:hover{ border-color:var(--red); }

    .dashboard-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .dashboard-mini>div,.mini-list{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
    .mini-list{margin-top:10px;line-height:1.9}
    @media (max-width:600px){.dashboard-mini{grid-template-columns:1fr}}

    .trend-list{margin-top:10px;display:flex;flex-direction:column;gap:9px}
    .trend-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;font-size:13px}
    .trend-label{color:var(--muted);text-transform:capitalize}.trend-track{height:9px;border-radius:999px;background:var(--chip-bg);overflow:hidden;border:1px solid var(--line)}
    .trend-fill{display:block;height:100%;border-radius:999px;background:var(--gold)}.trend-amt{min-width:82px;text-align:right}
</style>

<style>
.search-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.search-controls input,.search-controls select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
.search-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.search-results{margin-top:12px}

.insights-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.insight-card{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.insight-card .insight-label{font-size:.78rem;color:var(--muted);margin-bottom:5px}
.insight-card .insight-value{font-size:1.05rem;font-weight:600}
.insight-card .insight-note{font-size:.82rem;color:var(--muted);margin-top:5px}
@media(max-width:600px){.insights-grid{grid-template-columns:1fr}}
.txn-edit-panel{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:grid;gap:10px}
.txn-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.txn-edit-grid label{font-size:.8rem;color:var(--muted);display:grid;gap:4px}
.txn-edit-grid input,.txn-edit-grid select,.txn-edit-panel textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}
.txn-edit-actions{display:flex;gap:8px;flex-wrap:wrap}
.txn-edit-actions button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.txn-edit-actions .txn-save{background:var(--accent);color:#111;border-color:var(--accent)}
.txn-edit-actions .txn-cancel{background:transparent;color:var(--text)}
@media(max-width:600px){.txn-edit-grid{grid-template-columns:1fr}}

.search-result{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.search-result-main{min-width:0}.search-result-title{font-weight:600}.search-result-meta{font-size:.86rem;color:var(--muted);margin-top:3px}.search-result-amt{white-space:nowrap;font-weight:700}.search-result-amt.income{color:var(--mint)}.search-result-amt.expense{color:var(--red)}
@media(max-width:600px){.search-controls{grid-template-columns:1fr}.search-result{align-items:flex-start}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">Ledger</span>
  </div>
  <div class="header-right">
    <span id="offline-badge" class="offline-badge">Offline</span>
    <button id="install-btn" class="install-btn" type="button" aria-label="Install Ledger">＋ Install</button>
    <div class="balance-stat">
      <div class="amt num" id="header-balance">₹0.00</div>
      <div class="lbl">balance</div>
    </div>
    <div class="view-toggle">
      <button id="tab-chat" class="active">Chat</button>
      <button id="tab-summary">Summary</button>
    </div>
  </div>
</header>

<main>
  <div id="chat-view">
    <div id="chat-log"></div>
  </div>

  <div id="summary-view">
    <div id="summary-content"></div>
  </div>
</main>

<script>
(function(){
  const EXPENSE_CATEGORIES = ["Food","Housing","Utilities","Groceries","Transportation","Dining Out","Entertainment","Health & Fitness","Shopping","Travel","Insurance","Subscriptions","Education","Personal Care","Gifts & Donations","Debt Payment","Savings & Investments","Other"];
  const INCOME_CATEGORIES = ["Salary","Freelance","Business","Investment","Gift","Refund","Other"];
  const PAYMENT_METHODS = ["Cash","Credit Card","Debit Card","UPI","Net Banking","Wallet","Other"];

  function getCategories(type){
    const base = type === "Expense" ? EXPENSE_CATEGORIES : INCOME_CATEGORIES;
    return [...new Set([...base, ...(customCategories[type] || [])])];
  }

  function loadCustomCategories(){
    try{
      const saved = localStorage.getItem(CUSTOM_CATEGORIES_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        if(parsed && Array.isArray(parsed.Expense) && Array.isArray(parsed.Income)){
          customCategories = parsed;
        }
      }
    }catch(e){ customCategories = {Expense:[], Income:[]}; }
  }

  function saveCustomCategories(){
    localStorage.setItem(CUSTOM_CATEGORIES_KEY, JSON.stringify(customCategories));
    saveAppState();
  }

  function loadMerchantMemory(){
    try{
      const saved = localStorage.getItem(MERCHANT_MEMORY_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        if(parsed && parsed.Expense && parsed.Income) merchantMemory = parsed;
      }
    }catch(e){ merchantMemory = {Expense:{}, Income:{}}; }
  }

  function loadTrustedMerchantMemory(){
    try{
      const saved = localStorage.getItem(TRUSTED_MERCHANT_MEMORY_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        if(parsed && parsed.Expense && parsed.Income) trustedMerchantMemory = parsed;
      }
    }catch(e){ trustedMerchantMemory = {Expense:{}, Income:{}}; }
  }

  function saveTrustedMerchantMemory(){
    try{ localStorage.setItem(TRUSTED_MERCHANT_MEMORY_KEY, JSON.stringify(trustedMerchantMemory)); }catch(e){}
  }

  function saveMerchantMemory(){
    localStorage.setItem(MERCHANT_MEMORY_KEY, JSON.stringify(merchantMemory));
    saveAppState();
  }

  function loadRecurringRules(){
    try{
      const saved=localStorage.getItem(RECURRING_KEY);
      const parsed=saved?JSON.parse(saved):[];
      recurringRules=Array.isArray(parsed)?parsed:[];
    }catch(e){ recurringRules=[]; }
  }

  function loadAppState(){
    // Load the consolidated state first, but NEVER let an empty consolidated
    // merchant memory hide useful data from the older storage keys.
    let loadedConsolidated = false;
    try{
      const saved = localStorage.getItem(APP_STATE_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        if(parsed && Array.isArray(parsed.transactions)) transactions = parsed.transactions;
        if(parsed && parsed.customCategories && Array.isArray(parsed.customCategories.Expense) && Array.isArray(parsed.customCategories.Income)) customCategories = parsed.customCategories;
        if(parsed && parsed.merchantMemory && parsed.merchantMemory.Expense && parsed.merchantMemory.Income) merchantMemory = parsed.merchantMemory;
        if(parsed && Array.isArray(parsed.recurringRules)) recurringRules = parsed.recurringRules;
        if(parsed && parsed.budgets && parsed.budgets.Expense && typeof parsed.budgets.Expense === "object") budgets = parsed.budgets;
        loadedConsolidated = true;
      }
    }catch(e){ console.warn("Could not load consolidated app state", e); }

    // Merge legacy keys into the consolidated state without overwriting
    // anything that is already present.
    try{
      const legacyTx = localStorage.getItem(STORAGE_KEY);
      if(!transactions.length && legacyTx){
        const parsed = JSON.parse(legacyTx);
        if(Array.isArray(parsed)) transactions = parsed;
      }
    }catch(e){ console.warn("Could not migrate legacy transactions", e); }

    try{
      const legacyCats = localStorage.getItem(CUSTOM_CATEGORIES_KEY);
      if(legacyCats){
        const parsed = JSON.parse(legacyCats);
        if(parsed && Array.isArray(parsed.Expense) && Array.isArray(parsed.Income)){
          customCategories.Expense = [...new Set([...(customCategories.Expense||[]), ...parsed.Expense])];
          customCategories.Income = [...new Set([...(customCategories.Income||[]), ...parsed.Income])];
        }
      }
    }catch(e){ console.warn("Could not migrate legacy categories", e); }

    try{
      const legacyMemory = localStorage.getItem(MERCHANT_MEMORY_KEY);
      if(legacyMemory){
        const parsed = JSON.parse(legacyMemory);
        if(parsed && parsed.Expense && parsed.Income){
          merchantMemory.Expense = {...parsed.Expense, ...(merchantMemory.Expense||{})};
          merchantMemory.Income = {...parsed.Income, ...(merchantMemory.Income||{})};
        }
      }
    }catch(e){ console.warn("Could not migrate legacy merchant memory", e); }

    // IMPORTANT: do not infer learned merchant mappings from transaction history.
    // A transaction category is not proof that the merchant should always use
    // that category. Learned mappings must come from an explicit user choice.
    // This prevents entries such as "tea" from accidentally becoming
    // permanently mapped to an unrelated category like Education.

    // Clean up the accidental legacy mapping created by the earlier recovery
    // logic. This does not touch the transaction itself.
    if(merchantMemory.Expense){
      Object.keys(merchantMemory.Expense).forEach(key=>{
        const k=String(key).trim().toLowerCase();
        const c=String(merchantMemory.Expense[key] || "").trim().toLowerCase();
        // These mappings were created by earlier buggy builds and must never
        // be treated as user-learned rules. They are removed regardless of
        // what category they contain; the user can explicitly learn them again.
        if(["tea", "tea paytm", "keyboard"].includes(k)) delete merchantMemory.Expense[key];
      });
    }

    if(loadedConsolidated || transactions.length || Object.keys(merchantMemory.Expense).length || Object.keys(merchantMemory.Income).length){
      saveAppState();
    }
    return loadedConsolidated;
  }

  function rememberMerchant(type, merchant, category){
    merchant = String(merchant || "").trim().toLowerCase();
    category = String(category || "").trim();
    if(!merchant || !category) return;
    merchantMemory[type][merchant] = category;
    trustedMerchantMemory[type][merchant] = category;
    saveMerchantMemory();
    saveTrustedMerchantMemory();
  }

  function lookupRememberedCategory(type, merchant){
    if(!merchant) return null;
    const key = String(merchant).trim().toLowerCase();

    // HARD SAFETY: "tea" was accidentally learned as Education in an older
    // build. Never allow any stale tea mapping to affect a new entry.
    // This does not modify existing transactions.
    if(type === "Expense" && ["tea", "tea paytm", "keyboard"].includes(key)) {
      if(merchantMemory.Expense?.[key]) delete merchantMemory.Expense[key];
      try { localStorage.setItem(MERCHANT_MEMORY_KEY, JSON.stringify(merchantMemory)); } catch(e) {}
      try { saveAppState(); } catch(e) {}
      return null;
    }

    return trustedMerchantMemory[type]?.[key] || null;
  }

  function addCustomCategory(type, name){
    name = String(name || "").trim();

    if(!getCategories(type).some(c => c.toLowerCase() === name.toLowerCase())){
      customCategories[type].push(name);
      saveCustomCategories();
      return true;
    }
    return false;
  }

  function goBack(){
    if(!flowHistory.length){
      addBotMessage("You're already at the start of this entry.");
      return;
    }

    const previous = flowHistory.pop();
    draft = JSON.parse(JSON.stringify(previous.draft || {}));

    if(previous.step === "quick"){
      // If the original quick command was not recognized, Back returns to the
      // command box instead of incorrectly jumping to the payment step.
      if(!previous.reason){
        showTyping(()=>{
          addBotMessage("Okay — let's try another command.");
          renderQuickInput("");
        });
        return;
      }
      showTyping(()=>{
        if(previous.reason === "type"){
          addBotMessage("Is this an expense or income?");
          addChoices([
            {label:"Expense",onClick:()=>{draft.type="Expense";continueAfterQuick();}},
            {label:"Income",onClick:()=>{draft.type="Income";continueAfterQuick();}}
          ]);
        } else if(previous.reason === "category"){
          addBotMessage("Which category?");
          addChoices([
            ...getCategories(draft.type).map(c=>({
              label:c,onClick:()=>{draft.category=c;continueAfterQuick();}
            })),
            {label:"+ Add category",primary:true,onClick:()=>{
              askForNewCategory(draft.type,(name)=>{
                if(name){ draft.category=name; continueAfterQuick(); }
              });
            }}
          ]);
        } else if(previous.reason === "remember"){
          addBotMessage(`Should I remember <b>${escapeHtml(draft.merchant)}</b> as <b>${escapeHtml(draft.category)}</b> for next time?`);
          addChoices([
            {label:"Yes, remember",primary:true,onClick:()=>{
              rememberMerchant(draft.type,draft.merchant,draft.category);
              draft.merchantWasLearned=true;
              draft._rememberDecision="yes";
              continueAfterQuick();
            }},
            {label:"No, just this time",onClick:()=>{
              draft._rememberDecision="no";
              continueAfterQuick();
            }}
          ]);
        } else {
          addBotMessage("How'd you pay?");
          addChoices(PAYMENT_METHODS.map(p=>({
            label:p,onClick:()=>{draft.payment=p;continueAfterQuick();}
          })));
        }
        addBackButton();
      });
      return;
    }

    // Guided-flow fallback.
    step=previous.step;
    showTyping(()=>{
      if(step==="type"){
        addBotMessage("What are we logging?");
        addChoices([
          {label:"Expense",onClick:()=>pickType("Expense")},
          {label:"Income",onClick:()=>pickType("Income")}
        ]);
      }else if(step==="category"){
        addBotMessage("Which category?");
        addChoices(getCategories(draft.type).map(c=>({label:c,onClick:()=>pickCategory(c)})));
      }else if(step==="amount"){
        addBotMessage("Enter the amount.");
        addInputRow("e.g. 1,250",{numeric:true,buttonLabel:"Next",onSubmit:n=>pickAmount(n)});
      }else if(step==="payment"){
        addBotMessage("How'd you pay?");
        addChoices(PAYMENT_METHODS.map(p=>({label:p,onClick:()=>pickPayment(p)})));
      }else if(step==="date"){
        addBotMessage("What date should this transaction use?");
        addDateInput(draft.date || todayISO(),d=>pickDate(d));
      }else if(step==="note"){
        addBotMessage("Add a note (optional).");
        addInputRow("Add a note (optional)",{
          buttonLabel:"Add",skippable:true,
          onSubmit:val=>pickNote(val),onSkip:()=>pickNote("")
        });
      }
      if(step!=="type") addBackButton();
    });
  }

  const PAYMENT_RULES = {
    "google pay":"UPI", "gpay":"UPI", "phonepe":"UPI", "upi":"UPI",
    "paytm":"Wallet", "cash":"Cash", "credit card":"Credit Card",
    "credit":"Credit Card", "debit card":"Debit Card", "debit":"Debit Card",
