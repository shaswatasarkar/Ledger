<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF9F5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    (function(){
      var theme = "light";
      try{
        var saved = localStorage.getItem("ledger:theme");
        if(saved === "light" || saved === "dark") theme = saved;
        else if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      }catch(e){}
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute("content", theme === "dark" ? "#0E1510" : "#FAF9F5");
    })();
  </script>

<style>
  :root{
    --bg: #FAF9F5;
    --panel: #FFFFFF;
    --panel-2: #F2F1EA;
    --panel-raised: #FFFFFF;
    --line: #E4E1D6;
    --line-soft: #EDEBE1;
    --text: #16211B;
    --text-muted: #66766B;
    --text-dim: #9BA89E;
    --gold: #D97706;
    --gold-2: #F6A928;
    --gold-soft: rgba(217,119,6,0.13);
    --mint: #059669;
    --mint-soft: rgba(5,150,105,0.13);
    --red: #E11D2E;
    --red-soft: rgba(225,29,46,0.12);
    --chip-bg: #F3F1E8;
    --chip-hover: #FBEACB;
    --muted: var(--text-muted);
    --accent: var(--gold);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-pill: 999px;

    --shadow-sm: 0 1px 2px rgba(23,33,27,0.06);
    --shadow-md: 0 14px 30px -14px rgba(23,33,27,0.2);
    --nav-h: 62px;

    --header-bg: rgba(250,249,245,0.78);
    --nav-bg: rgba(250,249,245,0.88);
    --glow: rgba(217,119,6,0.10);

    --bubble-bg: #1B2A20;
    --bubble-text: #F3F1E7;
    --bubble-muted: #A9BBAC;
    --bubble-border: transparent;
    --bubble-user-bg: linear-gradient(135deg, #B45309, #8A3E0B);
    --bubble-user-text: #FFF6E8;

    color-scheme: light;
    font-size: 16px;
  }

  :root[data-theme="dark"]{
    --bg: #0E1510;
    --panel: #151E18;
    --panel-2: #1B261F;
    --panel-raised: #1B261F;
    --line: #2C3A31;
    --line-soft: #222E26;
    --text: #ECEBE2;
    --text-muted: #A3B3A7;
    --text-dim: #7B8C80;
    --gold: #F59E0B;
    --gold-2: #FBBF24;
    --gold-soft: rgba(245,158,11,0.15);
    --mint: #34D399;
    --mint-soft: rgba(52,211,153,0.15);
    --red: #FF7A7A;
    --red-soft: rgba(255,122,122,0.15);
    --chip-bg: #1E2A22;
    --chip-hover: #2E2814;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 14px 30px -14px rgba(0,0,0,0.7);

    --header-bg: rgba(14,21,16,0.78);
    --nav-bg: rgba(14,21,16,0.88);
    --glow: rgba(245,158,11,0.08);

    --bubble-bg: #1F2D24;
    --bubble-border: #33443A;

    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(600px 340px at 50% -60px, var(--glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    letter-spacing: 0.1px;
  }
  .num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    padding: 16px 20px;
    padding-top: max(16px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
    background: var(--header-bg);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    flex-shrink:0;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  .brand-mark{
    width:11px; height:11px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    display:inline-block;
    border-radius: 3px;
    transform: rotate(45deg);
    box-shadow: 0 0 0 5px var(--gold-soft), 0 0 14px -2px rgba(217,119,6,0.55);
    flex-shrink:0;
  }
  .brand-name{
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: 0.1px;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-shrink:0;
  }

  .auth-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    background:var(--chip-bg);
    color:var(--text);
    border-radius: var(--radius-pill);
    padding:7px 12px;
    font:500 12px 'IBM Plex Sans',sans-serif;
    cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .auth-btn:hover{ border-color: var(--gold); background: var(--chip-hover); }

  .sync-dot{
    width:7px; height:7px; border-radius:50%; flex-shrink:0;
  }
  .sync-dot.synced{ background: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }
  .sync-dot.syncing{ background: var(--gold); animation: blink 1s infinite; }
  .sync-dot.offline{ background: var(--text-dim); }
  .sync-dot.disconnected{ background: var(--text-dim); }
  .sync-dot.error{ background: var(--red); }

  .install-btn{
    display:none;
    border:1px solid var(--line);
    background:var(--chip-bg);
    color:var(--text);
    border-radius: var(--radius-pill);
    padding:8px 12px;
    font:500 12px 'IBM Plex Sans',sans-serif;
    cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .install-btn:hover{ border-color: var(--gold); background: var(--chip-hover); }
  .install-btn.show{display:inline-flex;align-items:center;gap:6px;}
  .offline-badge{
    display:none;
    align-items:center;
    gap:5px;
    font-size:11px;
    color: var(--text-muted);
    border:1px solid var(--line);
    border-radius: var(--radius-pill);
    padding:5px 9px 5px 7px;
  }
  .offline-badge::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background: var(--red);
    flex-shrink:0;
  }
  .offline-badge.show{display:inline-flex;}

  .theme-toggle{
    width: 38px; height: 38px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: var(--chip-bg);
    color: var(--text-muted);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .theme-toggle:hover{ border-color: var(--gold); background: var(--chip-hover); color: var(--text); }
  .theme-toggle:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .theme-toggle svg{
    display: none;
    width: 18px; height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  :root:not([data-theme="dark"]) .theme-toggle .icon-moon{ display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-sun{ display: block; }

  @media (max-width:560px){
    header{padding:12px 14px; padding-top: max(12px, env(safe-area-inset-top));}
    .header-right{gap:7px;}
    .auth-btn{padding:6px 9px;}
  }
  .balance-stat{
    text-align:right;
    line-height:1.1;
  }
  .balance-stat .amt{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight:700;
    letter-spacing: -0.3px;
    color: var(--mint);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 4px 12px;
    box-shadow: var(--shadow-sm);
  }
  .balance-stat .lbl{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    margin-top:3px;
  }

  .bottom-nav{
    position: sticky;
    bottom: 0;
    z-index: 20;
    display:flex;
    gap: 6px;
    padding: 7px max(14px, env(safe-area-inset-right)) max(7px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background: var(--nav-bg);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-top: 1px solid var(--line);
    flex-shrink:0;
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 3px;
    background: transparent;
    border: none;
    border-radius: var(--radius-md);
    color: var(--text-dim);
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 7px 4px 8px;
    cursor:pointer;
    transition: color .15s, background .15s;
  }
  .nav-btn svg{ width:21px; height:21px; stroke: currentColor; }
  .nav-btn:hover{ color: var(--text-muted); }
  .nav-btn.active{
    color: var(--text);
    background: var(--chip-bg);
  }
  .nav-btn.active svg{ stroke: var(--gold); }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width: 640px;
    width:100%;
    margin: 0 auto;
    min-height:0;
  }

  #chat-view{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  #chat-log{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    padding: 22px 20px 18px 20px;
    display:flex;
    flex-direction:column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .msg-row{
    display:flex;
    flex-direction:column;
    max-width: 84%;
    animation: rise .22s ease both;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:none; } }
  .msg-row.bot{ align-self:flex-start; }
  .msg-row.user{ align-self:flex-end; align-items:flex-end; }

  .msg-sender{
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 5px;
    padding: 0 3px;
  }
  .msg-row.user .msg-sender{ text-align:right; }

  .bubble{
    padding: 11px 14px;
    font-size: 14.5px;
    line-height:1.55;
    background: var(--bubble-bg);
    color: var(--bubble-text);
    border: 1px solid var(--bubble-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }
  .msg-row.bot .bubble{ border-bottom-left-radius: 4px; }
  .msg-row.user .bubble{
    background: var(--bubble-user-bg);
    color: var(--bubble-user-text);
    border-color: transparent;
    border-bottom-right-radius: 4px;
  }
  .bubble b{ font-weight: 700; }
  .bubble .highlight-amt{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    color: #4ADE94;
  }
  .bubble .highlight-amt.neg{ color: #FF8A80; }

  .confirm-card{
    padding: 14px 16px;
    background: var(--bubble-bg);
    color: var(--bubble-text);
    border: 1px solid var(--bubble-border);
    border-radius: var(--radius-lg);
    font-size: 13.5px;
    line-height: 1.6;
    box-shadow: var(--shadow-md);
    width: 100%;
    min-width: 240px;
  }
  .confirm-card .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.09);
  }
  .confirm-card .row:last-child{ border-bottom:none; padding-bottom:0; }
  .confirm-card .row:first-child{ padding-top:0; }
  .confirm-card .row .k{ color: var(--bubble-muted); font-size:12.5px; }
  .confirm-card .row .v{ font-family:'IBM Plex Mono', monospace; font-weight:600; color: var(--bubble-text); }

  .choices{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 0 3px;
  }
  .chip{
    background: var(--chip-bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    font-size: 13.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor:pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .chip:hover{
    background: var(--chip-hover);
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(217,119,6,0.15);
  }
  .chip:active{ transform: scale(0.97); }
  .chip.chosen{
    background: transparent;
    border-color: var(--line-soft);
    color: var(--text-dim);
    cursor:default;
  }
  .chip.danger{ color: var(--red); border-color: rgba(225,29,46,0.45); }
  .chip.primary{
    border-color: transparent;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #1A1206;
    font-weight: 700;
  }

  .back-chip{
    margin-top: 8px;
    color: var(--text-dim);
    border-color: transparent;
    background: transparent;
    padding-left: 6px;
    padding-right: 6px;
  }
  .msg-row.wide{ max-width: 100%; align-self: stretch; }

  .input-row{
    display:flex;
    gap: 8px;
    margin-top: 10px;
    padding: 0 2px;
  }
  .input-row input{
    flex:1;
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-family: 'IBM Plex Mono', monospace;
    outline:none;
  }
  .input-row input:focus{ border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .input-row button.send{
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color:#1A1206;
    border:none;
    padding:0 18px;
    border-radius:var(--radius-md);
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
  }

  .quick-examples{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:2px;
    padding:0 3px;
  }
  .quick-example{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-muted);
    padding: 7px 12px;
    border-radius: var(--radius-pill);
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    cursor:pointer;
  }

  .typing{
    display:flex;
    gap:4px;
    padding: 10px 13px;
    align-self:flex-start;
    background: var(--bubble-bg);
    border: 1px solid var(--bubble-border);
    border-radius: var(--radius-md);
    width: fit-content;
  }
  .typing span{
    width:5px; height:5px;
    background: var(--bubble-muted);
    border-radius:50%;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.2s; }
  .typing span:nth-child(3){ animation-delay: 0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  #summary-view{
    display:none;
    flex:1;
    overflow-y:auto;
    padding: 22px 20px 28px 20px;
  }
  .summary-subnav{
    display:flex;
    gap: 6px;
    margin-bottom: 20px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-pill);
    padding: 4px;
  }
  .subnav-btn{
    flex:1;
    background: transparent;
    border:none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 6px;
    border-radius: var(--radius-pill);
    cursor:pointer;
  }
  .subnav-btn.active{
    background: var(--chip-hover);
    color: var(--text);
  }
  .summary-section{ margin-bottom: 26px; }
  .summary-section h2{
    font-size: 12px;
    font-weight:600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    margin: 0 0 12px 0;
  }
  .stat-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat-box{
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-top: 2px solid var(--line);
    border-radius: var(--radius-md);
    padding: 13px 14px;
  }
  .stat-box.accent-income{ border-top-color: var(--mint); }
  .stat-box.accent-expense{ border-top-color: var(--red); }
  .stat-box.accent-net{ border-top-color: var(--gold); }
  .stat-box .v{ font-size: 18px; font-weight:700; font-family:'IBM Plex Mono', monospace; }
  .stat-box .v.income{ color: var(--mint); }
  .stat-box .v.expense{ color: var(--red); }
  .stat-box .l{ font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .cat-row{ display:flex; align-items:center; gap: 10px; margin-bottom: 11px; font-size: 13px; }
  .cat-row .cat-name{ width: 120px; flex-shrink:0; color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-row .cat-bar-track{ flex:1; height: 7px; background: var(--line-soft); border-radius: var(--radius-pill); overflow:hidden; }
  .cat-row .cat-bar-fill{ height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius: var(--radius-pill); }
  .cat-row .cat-amt{ width: 76px; text-align:right; font-family:'IBM Plex Mono', monospace; flex-shrink:0; }

  .trend-row{ display:grid; grid-template-columns:50px 1fr auto; gap:10px; align-items:center; font-size:13px; }
  .trend-label{ color:var(--text-muted); text-transform:capitalize; }
  .trend-track{ height:8px; border-radius:var(--radius-pill); background:var(--line-soft); overflow:hidden; }
  .trend-fill{ display:block; height:100%; border-radius:var(--radius-pill); background:linear-gradient(90deg, var(--gold), var(--gold-2)); }
  .trend-amt{ min-width:85px; text-align:right; font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }

  .txn-item{ display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .txn-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .txn-dot{ width: 9px; height: 9px; border-radius:50%; flex-shrink:0; background: var(--red); }
  .txn-dot.income{ background: var(--mint); }
  .txn-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .txn-cat{ font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .txn-meta{ font-size: 11.5px; color: var(--text-dim); }
  .txn-amt{ font-family:'IBM Plex Mono', monospace; font-weight:700; }
  .txn-amt.income{ color: var(--mint); }
  .txn-amt.expense{ color: var(--red); }
  .txn-del{ background:none; border:none; color: var(--text-dim); cursor:pointer; font-size: 15px; padding: 4px; }

  const chatLog = document.getElementById("chat-log");

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const fmt = (n) => {
    const sign = n < 0 ? "-" : "";
    return sign + "₹" + Math.abs(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
  };

  function capitalizeWords(s){ return String(s||"").replace(/\b\w/g, c => c.toUpperCase()); }
  function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
  function shiftDate(days){ const d=new Date(); d.setDate(d.getDate()+days); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
  function formatDisplayDate(date){ if(!date) return ""; return new Date(date + "T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
  function relativeDateLabel(k){ if(k===todayISO()) return "today"; if(k===shiftDate(-1)) return "yesterday"; return formatDisplayDate(k); }
  function txnDateKey(t){ return String(t.date||"").split("T")[0]; }
  function currentMonthKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
  function monthName(){ return new Date().toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
  function monthKeyOffset(offset){
    const d = new Date();
    d.setMonth(d.getMonth() + offset);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function monthLabelFromKey(key){
    if(!key) return "";
    const [y, m] = key.split("-");
    const d = new Date(parseInt(y), parseInt(m)-1, 1);
    return d.toLocaleDateString(undefined, { month: "short" });
  }
  function monthExpenseTotal(monthKey){
    return transactions
      .filter(t => t.type === "Expense" && txnDateKey(t).startsWith(monthKey))
      .reduce((s, t) => s + Number(t.amount || 0), 0);
  }
  function monthIncomeTotal(monthKey){
    return transactions
      .filter(t => t.type === "Income" && txnDateKey(t).startsWith(monthKey))
      .reduce((s, t) => s + Number(t.amount || 0), 0);
  }

  function getCategories(type){
    const base = type === "Expense" ? EXPENSE_CATEGORIES : INCOME_CATEGORIES;
    return [...new Set([...base, ...(customCategories[type] || [])])];
  }

  function getIncome(){ return transactions.filter(t=>t.type==="Income").reduce((s,t)=>s+t.amount,0); }
  function getExpense(){ return transactions.filter(t=>t.type==="Expense").reduce((s,t)=>s+t.amount,0); }
  function getNet(){ return getIncome() - getExpense(); }

  function renderBalance(){
    const net = getNet();
    headerBalance.textContent = fmt(net);
    headerBalance.style.color = net >= 0 ? "var(--mint)" : "var(--red)";
  }

  function saveAppState(){
    try{
      localStorage.setItem(APP_STATE_KEY, JSON.stringify({
        version:2, transactions, customCategories, merchantMemory, recurringRules, budgets, deletedRecurringKeys
      }));
    }catch(e){}
    syncPushSettings();
  }

  function loadAppState(){
    try{
      const saved = localStorage.getItem(APP_STATE_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        if(Array.isArray(parsed.transactions)) transactions = parsed.transactions;
        if(parsed.customCategories) customCategories = parsed.customCategories;
        if(parsed.merchantMemory) merchantMemory = parsed.merchantMemory;
        if(Array.isArray(parsed.recurringRules)) recurringRules = parsed.recurringRules;
        if(parsed.budgets) budgets = parsed.budgets;
        if(Array.isArray(parsed.deletedRecurringKeys)) deletedRecurringKeys = parsed.deletedRecurringKeys;
      }
    }catch(e){}
  }

  function saveTransactions(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions)); saveAppState(); return true; }
    catch(e){ return false; }
  }

  // --- Cloud Sync Implementation ---
  async function syncPushTransaction(txn){
    if(!supabase || !currentUser) return;
    try {
      await supabase.from('transactions').upsert({
        id: txn.id,
        user_id: currentUser.id,
        type: txn.type,
        category: txn.category,
        merchant: txn.merchant || '',
        amount: Number(txn.amount),
        payment: txn.payment || 'Other',
        note: txn.note || '',
        date: txn.date || new Date().toISOString(),
        recurring_key: txn.recurringKey || null,
        updated_at: new Date().toISOString()
      });
      updateSyncStatusUI("synced");
    } catch(e){ updateSyncStatusUI("error"); }
  }

  async function syncDeleteTransaction(id){
    if(!supabase || !currentUser) return;
    try {
      await supabase.from('transactions').delete().eq('id', id).eq('user_id', currentUser.id);
      updateSyncStatusUI("synced");
    } catch(e){}
  }

  async function syncPushSettings(){
    if(!supabase || !currentUser) return;
    try {
      await supabase.from('user_settings').upsert({
        user_id: currentUser.id,
        custom_categories: customCategories,
        merchant_memory: merchantMemory,
        recurring_rules: recurringRules,
        deleted_recurring_keys: deletedRecurringKeys,
        budgets: budgets,
        updated_at: new Date().toISOString()
      });
      updateSyncStatusUI("synced");
    } catch(e){}
  }

  async function syncPullAll(){
    if(!supabase || !currentUser) return;
    updateSyncStatusUI("syncing");
    try {
      const { data: remoteTxns } = await supabase.from('transactions').select('*').eq('user_id', currentUser.id);
      const { data: remoteSettings } = await supabase.from('user_settings').select('*').eq('user_id', currentUser.id).maybeSingle();

      if(remoteTxns && remoteTxns.length){
        const remoteMap = new Map(remoteTxns.map(t=>[t.id, t]));
        const unsyncedLocals = [];
        for(const loc of transactions){
          if(!remoteMap.has(loc.id)){
            unsyncedLocals.push(loc);
            syncPushTransaction(loc);
          }
        }
        const mappedRemote = remoteTxns.map(r=>({
          id: r.id, type: r.type, category: r.category, merchant: r.merchant||'',
          amount: Number(r.amount), payment: r.payment||'Other', note: r.note||'',
          date: r.date, recurringKey: r.recurring_key||null
        }));
        transactions = [...mappedRemote, ...unsyncedLocals];
      } else if(transactions.length){
        transactions.forEach(t=>syncPushTransaction(t));
      }

      if(remoteSettings){
        if(remoteSettings.custom_categories) customCategories = remoteSettings.custom_categories;
        if(remoteSettings.merchant_memory) merchantMemory = remoteSettings.merchant_memory;
        if(remoteSettings.recurring_rules) recurringRules = remoteSettings.recurring_rules;
        if(remoteSettings.budgets) budgets = remoteSettings.budgets;
      } else {
        syncPushSettings();
      }

      saveAppState();
      renderBalance();
      if(summaryViewEl.style.display !== "none") renderSummary();
      updateSyncStatusUI("synced");
    } catch(e){
      console.warn("Pull sync failed:", e);
      updateSyncStatusUI("error");
    }

    "broadband": ["Utilities"], "internet": ["Utilities"], "water": ["Utilities"], "gas": ["Utilities"],

    "netflix": ["Subscriptions"], "spotify": ["Subscriptions"], "prime": ["Subscriptions"],

    "icloud": ["Subscriptions"], "subscription": ["Subscriptions"],
    // Shopping
    "amazon": ["Shopping"], "flipkart": ["Shopping"], "myntra": ["Shopping"], "zara": ["Shopping"],
    "clothes": ["Shopping"], "shoes": ["Shopping"], "electronics": ["Shopping"], "mall": ["Shopping"],

  function normalizeQuickText(text){ return String(text||"").replace(/\s+/g," ").trim(); }

  function parseAmount(text){
    let cleaned = normalizeQuickText(text).toLowerCase().replace(/,/g,"");
    const m = cleaned.match(/(?:₹|rs\.?|inr)?\s*(\d+(?:\.\d+)?)\s*(k|thousand|lakhs?|lacs?)?\b/i);
    if(!m) return null;
    let n = parseFloat(m[1]);
    const s = (m[2]||"").toLowerCase();
    if(s === "k" || s === "thousand") n *= 1000;
    if(s.startsWith("lakh") || s.startsWith("lac")) n *= 100000;
    return n > 0 ? n : null;
  }

  function parseDate(text){
    const lower = normalizeQuickText(text).toLowerCase();
    let m = lower.match(/\b(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\b/);
    if(m){ const d=new Date(m[1], m[2]-1, m[3]); if(d.getDate()==m[3]) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`; }
    if(/\byesterday\b/.test(lower)) return shiftDate(-1);
    if(/\btoday\b/.test(lower)) return shiftDate(0);

    m = lower.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/);
    if(m){
      const day=parseInt(m[1],10), month=parseInt(m[2],10);
      let year=m[3]?parseInt(m[3],10):new Date().getFullYear();
      if(year<100) year+=2000;
      if(month>=1 && month<=12 && day>=1 && day<=31){
        const d=new Date(year, month-1, day);
        if(d.getDate()==day) return `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      }
    }
    return null;
  }

  function parseQuickEntry(text){
    let cleaned = normalizeQuickText(text).toLowerCase();
    let amount = parseAmount(cleaned);
    let date = parseDate(cleaned) || todayISO();
    let isIncome = /\b(salary|stipend|freelance|bonus|income|received|refund|cashback|dividend|interest)\b/.test(cleaned);
    let type = isIncome ? "Income" : "Expense";
    let merchant = cleaned
      .replace(/(?:₹|rs\.?|inr)?\s*\d[\d,]*(?:\.\d+)?\s*(?:k|thousand|lakhs?|lacs?)?\b/gi,"")
      .replace(/\b(yesterday|today|on|for|spent|paid|received|got)\b/gi,"")
      .trim();

    let category = null;
    for(const [mKey, cats] of Object.entries(MERCHANT_RULES)){
      if(cleaned.includes(mKey)){
        if(!merchant) merchant = mKey;
        category = cats[0];
        break;
      }
    }
    if(!category && merchantMemory[type]?.[merchant]) category = merchantMemory[type][merchant];
    if(!category){
      category = type === "Income" ? "Salary" : "Food";
    }
    if(!merchant) merchant = category;
    return { amount, date, type, merchant, category };
  }

      merchant: parsed.merchant || parsed.category,
      amount: parsed.amount,
      payment: "UPI",
      note: "",

      exportedAt: new Date().toISOString(),
      transactions,
      customCategories,
      merchantMemory,
      budgets
    }, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ledger-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

  function importBackupJSON(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const imported = Array.isArray(parsed) ? parsed : (parsed.transactions || []);
        if(!Array.isArray(imported)) throw new Error("Invalid format");
        transactions = imported.map(t => ({
          id: t.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
          type: t.type === "Income" ? "Income" : "Expense",
          category: t.category || "Other",
          merchant: t.merchant || t.category || "Expense",
          amount: Number(t.amount || 0),
          payment: t.payment || "Other",
          note: t.note || "",
          date: t.date || new Date().toISOString()
        }));
        if(parsed.customCategories) customCategories = parsed.customCategories;
        if(parsed.merchantMemory) merchantMemory = parsed.merchantMemory;
        if(parsed.budgets) budgets = parsed.budgets;

        saveAppState();
        renderBalance();
        renderSummary();
        if(currentUser){
          transactions.forEach(t => syncPushTransaction(t));
          syncPushSettings();
        }
        alert(`Successfully imported ${transactions.length} transactions!`);
      } catch(err){
        alert("Failed to import backup: invalid file format.");
      }
    };
    reader.readAsText(file);
  }

    updateSyncStatusUI("error");
    authBtnLabel.textContent = "Offline";
  });

  // --- Initial Launch ---
  async function init(){
    loadAppState();
    renderBalance();
    if(supabase){
      supabase.auth.onAuthStateChange(async (event, session) => {
        if(session?.user){
          currentUser = session.user;
          updateSyncStatusUI("syncing");
          await syncPullAll();
        } else {
          currentUser = null;
          updateSyncStatusUI("disconnected");
        }
      });
      const { data: { session } } = await supabase.auth.getSession();
      currentUser = session?.user || null;
      if(currentUser){
        updateSyncStatusUI("syncing");
        await syncPullAll();
      } else {
        updateSyncStatusUI("disconnected");
      }
    } else {
      updateSyncStatusUI("disconnected");
    }

    addBotMessage("Hi, I'm Ledger. Tell me what you spent or earned, in your own words — no forms needed.");
    renderQuickInput();
  }

  init();
})();
</script>
</body>
</html>
