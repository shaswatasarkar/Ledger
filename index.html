          <button class="data-action" id="rr-add">+ Add monthly</button>
        </div>
        <div class="empty-note" style="margin-top:8px;">Ledger creates the transaction automatically when the monthly due date arrives. Existing transactions are never changed.</div>
        <div id="rr-list" style="margin-top:12px;"></div>
      </div>`;
    summaryContent.appendChild(section);
    const list=section.querySelector("#rr-list");
    function render(){
      const active=recurringRules.filter(r=>r.active!==false);
      list.innerHTML=active.length?active.map(r=>`<div class="memory-row"><div class="memory-name"><b>${escapeHtml(r.name||r.merchant||r.category)}</b> → ${fmt(r.amount)} · ${escapeHtml(r.category)} · day ${r.dayOfMonth}</div><button class="memory-edit rr-delete" data-id="${r.id}">Stop</button></div>`).join(""):"<div class='empty-note'>No recurring transactions set up yet.</div>";
      list.querySelectorAll(".rr-delete").forEach(b=>b.onclick=()=>{ removeRecurringRule(b.dataset.id); render(); });
    }
    section.querySelector("#rr-add").onclick=()=>{
      const name=section.querySelector("#rr-name").value.trim(); const amount=parseFloat(section.querySelector("#rr-amount").value.replace(/,/g,"")); const day=parseInt(section.querySelector("#rr-day").value,10); const category=section.querySelector("#rr-category").value; const payment=section.querySelector("#rr-payment").value; const startDate=section.querySelector("#rr-start").value;
      if(!name||!amount||amount<=0||!day||day<1||day>31||!startDate){ alert("Please enter a name, amount, valid day, and start date."); return; }
      addRecurringRule({name,type:"Expense",merchant:name.toLowerCase(),amount,category,payment,dayOfMonth:day,startDate});
      addBotMessage(`Added recurring <b>${escapeHtml(name)}</b> · ${fmt(amount)} monthly on day ${day}.`);
    };
    render();
  }

  function addBudgetManager(){
    const section=document.createElement("div"); section.className="summary-section";
    const catOptions=getCategories("Expense").map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    section.innerHTML=`
      <h2>Budgets</h2>
      <div class="memory-card">
        <div class="input-row" style="flex-wrap:wrap;">
          <select id="budget-category" style="flex:1;min-width:180px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;">${catOptions}</select>
          <input id="budget-amount" placeholder="Monthly limit" inputmode="decimal" style="width:150px;">
          <button class="data-action" id="budget-add">Set budget</button>
        </div>
        <div class="empty-note" style="margin-top:8px;">Budgets reset each calendar month. Transactions are never changed.</div>
        <div id="budget-list" style="margin-top:12px;"></div>
      </div>`;
    summaryContent.appendChild(section);
    const list=section.querySelector("#budget-list");
    function render(){
      const entries=Object.entries(budgets.Expense||{}).filter(([,v])=>Number(v)>0);
      list.innerHTML=entries.length ? entries.map(([cat,limit])=>{
        const st=budgetStatus(cat);
        const over=st.spent>st.limit;
        return `<div class="memory-row"><div class="memory-name"><b>${escapeHtml(cat)}</b> · ${fmt(st.spent)} / ${fmt(st.limit)}${over?` · <b>over by ${fmt(st.spent-st.limit)}</b>`:` · ${fmt(st.remaining)} left`}</div><button class="memory-edit budget-remove" data-cat="${escapeHtml(cat)}">Remove</button></div>`;
      }).join("") : "<div class='empty-note'>No budgets set yet.</div>";
      list.querySelectorAll(".budget-remove").forEach(b=>b.onclick=()=>{ delete budgets.Expense[b.dataset.cat]; saveBudgets(); render(); });
    }
    section.querySelector("#budget-add").onclick=()=>{
      const cat=section.querySelector("#budget-category").value;
      const amount=parseFloat(section.querySelector("#budget-amount").value.replace(/,/g,""));
      if(!cat || !amount || amount<=0){ alert("Enter a valid monthly budget."); return; }
      budgets.Expense[cat]=amount; saveBudgets(); section.querySelector("#budget-amount").value=""; render();
    };
    render();
  }

  function addCategoryManager(){
    const section=document.createElement("div");
    section.className="summary-section";
    section.innerHTML=`
      <h2>Custom categories</h2>
      <div class="data-actions">
        <button class="data-action" id="add-expense-cat">+ Expense Category</button>
        <button class="data-action" id="add-income-cat">+ Income Category</button>
      </div>
      <div class="empty-note" id="custom-cat-list"></div>
    `;
    summaryContent.appendChild(section);
    const list=section.querySelector("#custom-cat-list");
    function render(){
      const e=customCategories.Expense.length ? customCategories.Expense.join(" · ") : "No custom expense categories";
      const i=customCategories.Income.length ? customCategories.Income.join(" · ") : "No custom income categories";
      list.innerHTML=`<b>Expenses:</b> ${escapeHtml(e)}<br><b>Income:</b> ${escapeHtml(i)}`;
    }
    section.querySelector("#add-expense-cat").onclick=()=>{
      const name=window.prompt("New expense category:");
      if(name && addCustomCategory("Expense",name)) render();
    };
    section.querySelector("#add-income-cat").onclick=()=>{
      const name=window.prompt("New income category:");
      if(name && addCustomCategory("Income",name)) render();
    };
    render();
  }

  function finishMerchantEdit(type, merchant, category){
    merchantMemory[type][merchant.toLowerCase()] = category;
    trustedMerchantMemory[type][merchant.toLowerCase()] = category;
    saveMerchantMemory();
    saveTrustedMerchantMemory();
    renderSummary();
    switchView("chat");
    addBotMessage(`Updated <b>${escapeHtml(merchant)}</b> → <b>${escapeHtml(category)}</b>. I'll use <b>${escapeHtml(category)}</b> for future ${type.toLowerCase()} entries.`);
    addChoices([
      {label:"Log transaction", primary:true, onClick:()=>{
        draft={merchant:merchant, type:type, category:category};
        flowHistory=[];
        renderQuickInput();
      }},
      {label:"Done", onClick:()=>{
        addBotMessage("Done. What would you like to log next?");
        renderQuickInput();
      }}
    ]);
  }

  function editMerchantCategory(type, merchant){
    const categories = getCategories(type);
    const current = lookupRememberedCategory(type, merchant);

    // If the edit was opened from Summary, move back to Chat so the editing
    // conversation remains visible instead of appearing to terminate.
    switchView("chat");
    addBotMessage(`Change the category for <b>${escapeHtml(merchant)}</b>. Current category: <b>${escapeHtml(current || "None")}</b>`);
    addChoices([
      ...categories.map(category => ({
        label: category,
        onClick: () => finishMerchantEdit(type, merchant, category)
      })),
      {
        label: "+ Add category",
        primary: true,
        onClick: () => askForNewCategory(type, (name) => {
          if(name) finishMerchantEdit(type, merchant, name);
        })
      }
    ]);
    addBackButton();
  }

  function addMerchantMemoryManager(){
    const section=document.createElement("div");
    section.className="summary-section";
    section.innerHTML=`<h2>Learned categories</h2><div class="memory-card"><div class="empty-note" id="merchant-memory-list"></div></div>`;
    summaryContent.appendChild(section);
    const list=section.querySelector("#merchant-memory-list");

    const rows=[];
    Object.entries(trustedMerchantMemory.Expense).forEach(([m,c])=>{
      rows.push(`
        <div class="memory-row">
          <div class="memory-name"><b>${escapeHtml(m)}</b> → ${escapeHtml(c)} <span class="empty-note">(expense)</span></div>
          <button class="memory-edit" data-type="Expense" data-merchant="${escapeHtml(m)}">Edit</button>
        </div>`);
    });
    Object.entries(trustedMerchantMemory.Income).forEach(([m,c])=>{
      rows.push(`
        <div class="memory-row">
          <div class="memory-name"><b>${escapeHtml(m)}</b> → ${escapeHtml(c)} <span class="empty-note">(income)</span></div>
          <button class="memory-edit" data-type="Income" data-merchant="${escapeHtml(m)}">Edit</button>
        </div>`);
    });

    list.innerHTML=rows.length ? rows.join("") : "No learned merchant mappings yet. Use \"Yes, remember\" after a transaction and the mapping will appear here.";

    list.querySelectorAll(".memory-edit").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        editMerchantCategory(btn.dataset.type, btn.dataset.merchant);
      });
    });
  }


  function importBackupText(text){
    try{
      const parsed = JSON.parse(String(text || "").trim());
      const imported = Array.isArray(parsed) ? parsed : parsed.transactions;
      if(!Array.isArray(imported)) throw new Error("Invalid backup");

      const valid = imported.filter(t =>
        t && t.id && (t.type==="Income" || t.type==="Expense") &&
        typeof t.amount==="number" && typeof t.category==="string"
      );
      if(valid.length !== imported.length) throw new Error("Invalid transaction data");

      transactions = valid;

      if(!Array.isArray(parsed)){
        if(parsed.customCategories &&
           Array.isArray(parsed.customCategories.Expense) &&
           Array.isArray(parsed.customCategories.Income)){
          customCategories = parsed.customCategories;
          saveCustomCategories();
        }
        if(parsed.merchantMemory &&
           parsed.merchantMemory.Expense &&
           parsed.merchantMemory.Income){
          merchantMemory = parsed.merchantMemory;
          saveMerchantMemory();
        }
        if(Array.isArray(parsed.recurringRules)){
          recurringRules = parsed.recurringRules;
          saveRecurringRules();
        }
      }

      saveTransactions();
      renderBalance();
      renderSummary();
      addBotMessage(`Restored ${transactions.length} transaction${transactions.length===1?'':'s'} plus saved categories and learned merchants.`);
      return true;
    }catch(err){
      console.error(err);
      addBotMessage("I couldn't read that backup text. Make sure you pasted the complete JSON backup.");
      return false;
    }
  }

  function addDataTools(){
    const section = document.createElement("div");
    section.className = "summary-section";
    section.innerHTML = `
      <h2>Data</h2>
      <div class="data-actions">
        <button type="button" class="data-action" id="export-backup">Export Backup</button>
        <button type="button" class="data-action" id="copy-backup">Copy Backup</button>
        <button type="button" class="data-action" id="import-backup">Import Backup</button>
        <input id="backup-file" type="file" accept=".json,application/json" style="display:none">
      </div>
      <div id="backup-status" class="empty-note" style="margin-top:8px;"></div>
      <div style="margin-top:10px;">
        <button type="button" class="data-action" id="paste-backup-toggle">Restore from Backup Text</button>
        <textarea id="paste-backup-box" placeholder="Paste a Ledger JSON backup here..." style="display:none;width:100%;min-height:150px;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:monospace;font-size:12px;"></textarea>
        <button type="button" class="data-action" id="paste-backup-restore" style="display:none;margin-top:8px;">Restore Pasted Backup</button>
      </div>
    `;
    summaryContent.appendChild(section);

    section.querySelector("#export-backup").addEventListener("click", e=>{
      e.preventDefault(); e.stopPropagation(); exportBackup();
    });
    section.querySelector("#copy-backup").addEventListener("click", e=>{
      e.preventDefault(); e.stopPropagation(); copyBackup();
    });
    section.querySelector("#import-backup").addEventListener("click", e=>{
      e.preventDefault(); e.stopPropagation(); section.querySelector("#backup-file").click();
    });
    section.querySelector("#backup-file").addEventListener("change", ()=>{
      importBackupFile(section.querySelector("#backup-file").files[0]);
      section.querySelector("#backup-file").value="";
    });

    const toggle=section.querySelector("#paste-backup-toggle");
    const box=section.querySelector("#paste-backup-box");
    const restore=section.querySelector("#paste-backup-restore");
    toggle.addEventListener("click", ()=>{
      const show=box.style.display==="none";
      box.style.display=show?"block":"none";
      restore.style.display=show?"inline-block":"none";
      if(show) box.focus();
    });
    restore.addEventListener("click", ()=>{
      if(importBackupText(box.value)) box.value="";
    });
  }

  // ---------- view switching ----------
  function switchView(view){
    if(view === "chat"){
      tabChat.classList.add("active");
      tabSummary.classList.remove("active");
      chatViewEl.style.display = "flex";
      summaryViewEl.style.display = "none";

      // Returning from Summary must never leave Chat with only a disabled
      // command box. Navigation is not the end of the conversation. If there
      // is no active command input, provide a fresh one while preserving the
      // existing chat history and draft state.
      const activeInput = chatLog.querySelector(".input-row input:not(:disabled)");
      if(!activeInput){
        renderQuickInput();
      }
    } else {
      tabSummary.classList.add("active");
      tabChat.classList.remove("active");
      chatViewEl.style.display = "none";
      summaryViewEl.style.display = "block";
      renderSummary();
    }
  }
  tabChat.addEventListener("click", () => switchView("chat"));
  tabSummary.addEventListener("click", () => switchView("summary"));

  // ---------- PWA / phone experience ----------
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById("install-btn");
  const offlineBadge = document.getElementById("offline-badge");

  function updateOnlineStatus(){
    if(!navigator.onLine) offlineBadge.classList.add("show");
    else offlineBadge.classList.remove("show");
  }
  window.addEventListener("online", updateOnlineStatus);
  window.addEventListener("offline", updateOnlineStatus);
  updateOnlineStatus();

  window.addEventListener("beforeinstallprompt", (event)=>{
    event.preventDefault();
    deferredInstallPrompt = event;
    installBtn.classList.add("show");
  });

  installBtn.addEventListener("click", async ()=>{
    if(!deferredInstallPrompt){
      addBotMessage("To install Ledger, open this app from a supported browser over HTTPS (or localhost). If you're opening the HTML directly as a file, installation isn't available yet.");
      return;
    }
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch(e) {}
    deferredInstallPrompt = null;
    installBtn.classList.remove("show");
  });

  window.addEventListener("appinstalled", ()=>{
    deferredInstallPrompt = null;
    installBtn.classList.remove("show");
  });

  // ---------- init ----------
  async function init(){
    addBotMessage("Loading your ledger…");
    const hadConsolidatedState = loadAppState();
    loadTrustedMerchantMemory();
    loadRecurringRules();
    loadBudgets();
    ensureRecurringTransactions();

    // One-time cleanup of the specific bad legacy rule. Do this after all
    // state sources have been loaded so an older backup cannot reintroduce it.
    // Remove the bad legacy tea mapping regardless of what category it contains.
    // The user must explicitly choose a category before tea can be learned again.
    ["tea", "tea paytm", "keyboard"].forEach(k=>{
      if (merchantMemory.Expense?.[k]) delete merchantMemory.Expense[k];
      if (trustedMerchantMemory.Expense?.[k]) delete trustedMerchantMemory.Expense[k];
    });
    try { localStorage.setItem(MERCHANT_MEMORY_KEY, JSON.stringify(merchantMemory)); } catch(e) {}
    saveTrustedMerchantMemory();
    try { saveAppState(); } catch(e) {}

    if(!hadConsolidatedState) loadTransactions();
    else storageReady = true;
    saveAppState();
    chatLog.innerHTML = "";
    renderBalance();

    if(transactions.length){
      addBotMessage(`Welcome back. You've logged ${transactions.length} transaction${transactions.length===1?'':'s'} so far.`);
    } else {
      addBotMessage("Hi, I'm your ledger. Let's log your first transaction.");
    }
    startFlow();
  }

  init();
})();
</script>
