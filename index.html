  function normalizeQuickText(text){
    return String(text || "")
      .replace(/\u00a0/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function parseAmount(text){
    const cleaned = normalizeQuickText(text).toLowerCase().replace(/,/g,"");
    // Accept: 250, ₹250, 1.2k, 45k, 2 lakh, and amounts embedded in text.
    const matches = [...cleaned.matchAll(/(?:₹\s*)?(\d+(?:\.\d+)?)\s*(k|thousand|lakh|lac|l)?\b/gi)];
    if(!matches.length) return null;
    let best = null;
    for(const m of matches){
      let n = parseFloat(m[1]);
      const suffix = (m[2] || "").toLowerCase();
      if(suffix === "k" || suffix === "thousand") n *= 1000;
      if(suffix === "lakh" || suffix === "lac" || suffix === "l") n *= 100000;
      if(n > 0){ best = n; break; }
    }
    return best;
  }

  function toDateInputValue(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function shiftDate(days){
    const d = new Date();
    d.setHours(12,0,0,0);
    d.setDate(d.getDate()+days);
    return toDateInputValue(d);
  }

  function parseDate(text){
    const lower = normalizeQuickText(text).toLowerCase();

    // Explicit numeric dates have priority. This prevents a command such as
    // "spent 44 on tea on 9/9 using paytm" from silently falling back to today.
    let m = lower.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/);
    if(m){
      const day=parseInt(m[1],10), month=parseInt(m[2],10);
      let year=m[3]?parseInt(m[3],10):new Date().getFullYear();
      if(year<100) year+=2000;
      const d=new Date(year,month-1,day);
      if(d.getFullYear()===year && d.getMonth()===month-1 && d.getDate()===day) return toDateInputValue(d);
    }

    if(/\bday\s+before\s+yesterday\b/.test(lower)) return shiftDate(-2);
    if(/\byesterday\b/.test(lower)) return shiftDate(-1);
    if(/\btoday\b/.test(lower)) return shiftDate(0);
    if(/\btomorrow\b/.test(lower)) return shiftDate(1);

    const months={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};

    // 9 Sep / 9 September / 9 Sep 2026
    m=lower.match(/\b(\d{1,2})\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)(?:\s+(\d{4}))?\b/);
    if(m){
      const day=parseInt(m[1],10), month=months[m[2]], year=m[3]?parseInt(m[3],10):new Date().getFullYear();
      const d=new Date(year,month,day);
      if(d.getFullYear()===year && d.getMonth()===month && d.getDate()===day) return toDateInputValue(d);
    }

    // Sep 9 / September 9 / Sep 9 2026
    m=lower.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{1,2})(?:\s+(\d{4}))?\b/);
    if(m){
      const month=months[m[1]], day=parseInt(m[2],10), year=m[3]?parseInt(m[3],10):new Date().getFullYear();
      const d=new Date(year,month,day);
      if(d.getFullYear()===year && d.getMonth()===month && d.getDate()===day) return toDateInputValue(d);
    }
    return null;
  }

  function detectPayment(text){
    const lower=normalizeQuickText(text).toLowerCase();
    const key=Object.keys(PAYMENT_RULES).sort((a,b)=>b.length-a.length).find(k=>new RegExp(`\\b${k.replace(/[.*+?^${}()|[\\]\\]/g,"\\$&")}\\b`,"i").test(lower) || lower.includes(k));
    return key ? PAYMENT_RULES[key] : null;
  }

  function detectType(text){
    const lower=normalizeQuickText(text).toLowerCase();
    if(/\b(salary|freelance|income|received|receive|got|refund|cashback|earned|earning|credited)\b/.test(lower)) return "Income";
    if(/\b(spent|spend|paid|bought|buy|expense|cost|purchase|purchased)\b/.test(lower)) return "Expense";
    return null;
  }

  function getKnownMerchants(){
    // Only built-in rules and explicitly trusted mappings participate here.
    // Raw/legacy merchant memory is never used for matching.
    return [...new Set([
      ...Object.keys(MERCHANT_RULES),
      ...Object.keys(trustedMerchantMemory.Expense || {}),
      ...Object.keys(trustedMerchantMemory.Income || {})
    ])].sort((a,b)=>b.length-a.length);
  }

  function merchantTokenMatches(text, merchant){
    const lower = normalizeQuickText(text).toLowerCase();
    const escaped = String(merchant).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(`(?:^|\\s|[₹])${escaped}(?=$|\\s|[.,!?])`, "i").test(lower);
  }

  function detectMerchant(text){
    const known = getKnownMerchants().find(k => merchantTokenMatches(text, k));
    return known || null;
  }

  function inferMerchant(text){
    let cleaned = normalizeQuickText(text).toLowerCase();
    cleaned = cleaned
      .replace(/\bday\s+before\s+yesterday\b/g,"")
      .replace(/\byesterday\b|\btoday\b|\btomorrow\b/g,"")
      .replace(/\b\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?\b/g,"")
      .replace(/\b(?:\d{1,2}\s+(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)(?:\s+\d{4})?|(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+\d{1,2}(?:\s+\d{4})?)\b/g,"")
      .replace(/₹?\s*\d[\d,]*(?:\.\d+)?\s*(?:k|thousand|lakh|lac|l)?\b/g,"")
      .replace(/\b(expense|income|spent|spend|paid|bought|buy|cost|purchase|purchased|received|receive|got|earned|earning|cashback|credited|on|from|for|using|via|with|google\s+pay|gpay|phonepe|upi|paytm|cash|credit\s+card|credit|debit\s+card|debit|net\s+banking|bank\s+transfer|wallet)\b/g,"")
      .replace(/\s+/g," ").trim();

    // Prefer a known merchant only on a token boundary. Never use a raw
    // substring match: e.g. a learned "keyboard" rule must not affect an
    // unrelated merchant/item such as "atta".
    const known = getKnownMerchants().find(k=>merchantTokenMatches(cleaned,k));
    return known || cleaned || null;
  }

  function parseQuickEntry(text){
    let merchant=detectMerchant(text) || inferMerchant(text);
    let type=detectType(text);
    if(!type && merchant && ["salary","freelance","refund"].includes(merchant)) type="Income";
    if(!type && merchant && merchantMemory.Income && merchantMemory.Income[merchant]) type="Income";
    if(!type && merchant) type = "Expense";

    // Safety guard: the old broken versions could have persisted tea → Education.
    // Never allow that stale mapping to classify a new tea entry.
    if(type === "Expense" && (merchant === "tea" || merchant === "tea paytm") &&
       String(merchantMemory.Expense?.[merchant] || "").toLowerCase() === "education") {
      delete merchantMemory.Expense[merchant];
      saveMerchantMemory();
    }

    const parsedDate = parseDate(text);

    // TEA SAFETY OVERRIDE:
    // "tea" is a normal merchant/item and must never inherit a category from
    // an old transaction or stale merchant-memory entry. Only an explicit
    // user choice can teach tea a category later.
    const teaMentioned = /\btea\b/i.test(normalizeQuickText(text));
    if(teaMentioned && type === "Expense") {
      merchant = "tea";
      return {
        amount:parseAmount(text),
        date:parsedDate || todayISO(),
        payment:detectPayment(text),
        type,
        merchant:"tea",
        category:null,
        merchantWasLearned:false,
        merchantWasBuiltIn:false
      };
    }

    const rememberedCategory = type ? lookupRememberedCategory(type, merchant) : null;
    const builtInCategory = merchant && MERCHANT_RULES[merchant] ? MERCHANT_RULES[merchant][0] : null;

    // If the user explicitly supplied a date, always preserve it.
    // Learned categories are only used when lookupRememberedCategory explicitly
    // returns one; there is no category inference from transaction history.
    return {
      amount:parseAmount(text),
      date:parsedDate || todayISO(),
      payment:detectPayment(text),
      type,
      merchant,
      category: rememberedCategory || builtInCategory,
      merchantWasLearned: !!rememberedCategory,
      merchantWasBuiltIn: !!builtInCategory
    };
  }

  function handleCategoryChangeCommand(text){
    // Supports both:
    //   change coffee category to food
    //   change tea to food
    const m = text.trim().match(/^change\s+(.+?)\s+(?:category\s+)?to\s+(.+)$/i);
    if(!m) return false;

    const merchant = m[1].trim().toLowerCase();
    const requested = m[2].trim();

    // A category-change command is itself an explicit instruction, so an
    // unknown merchant does NOT need to have been learned beforehand.
    // Default unknown merchants to Expense; known income merchants stay Income.
    let type = null;
    if(trustedMerchantMemory.Income[merchant]) type = "Income";
    else if(trustedMerchantMemory.Expense[merchant]) type = "Expense";
    else if(MERCHANT_RULES[merchant]) {
      type = ["salary","freelance","refund"].includes(merchant) ? "Income" : "Expense";
    } else {
      type = "Expense";
    }

    const category = getCategories(type).find(c=>c.toLowerCase()===requested.toLowerCase());
    if(category){
      merchantMemory[type][merchant] = category;
      trustedMerchantMemory[type][merchant] = category;
      saveMerchantMemory();
      saveTrustedMerchantMemory();
      addBotMessage(`Updated <b>${escapeHtml(merchant)}</b> → <b>${escapeHtml(category)}</b>. I'll use <b>${escapeHtml(category)}</b> for future ${type.toLowerCase()} entries.`);
      addBotMessage("Existing transactions are unchanged.");
      addChoices([
        {label:"Log transaction",primary:true,onClick:()=>{
          draft={};
          flowHistory=[];
          renderQuickInput();
        }},
        {label:"Done",onClick:()=>{}}
      ]);
      return true;
    }

    addBotMessage(`I couldn't find a category called <b>${escapeHtml(requested)}</b>. Choose the category for <b>${escapeHtml(merchant)}</b>.`);
    addChoices(getCategories(type).map(c=>({
      label:c,
      onClick:()=>{
        merchantMemory[type][merchant]=c;
        trustedMerchantMemory[type][merchant]=c;
        saveMerchantMemory();
        saveTrustedMerchantMemory();
        addBotMessage(`Updated <b>${escapeHtml(merchant)}</b> → <b>${escapeHtml(c)}</b>. I'll use it for future entries.`);
        addBotMessage("Existing transactions are unchanged.");
        addChoices([
          {label:"Log transaction",primary:true,onClick:()=>{draft={};flowHistory=[];renderQuickInput();}},
          {label:"Done",onClick:()=>{}}
        ]);
      }
    })));
    addBackButton();
    return true;
  }

  function getLastTransaction(){
    if(lastSavedTransactionId){
      const found = transactions.find(t=>t.id===lastSavedTransactionId);
      if(found) return found;
    }
    return transactions.length ? transactions[transactions.length-1] : null;
  }

  async function undoLastTransaction(){
    const txn = getLastTransaction();
    if(!txn){
      addBotMessage("There’s nothing to undo yet.");
      return;
    }
    transactions = transactions.filter(t=>t.id !== txn.id);
    await saveTransactions();
    lastSavedTransactionId = transactions.length ? transactions[transactions.length-1].id : null;
    renderBalance();
    addBotMessage(`Undone. Removed <b>${escapeHtml(txn.merchant || txn.category)}</b> · ${fmt(txn.amount)}.`);
    addChoices([
      {label:"Log another",primary:true,onClick:()=>startFlow()},
      {label:"View summary",onClick:()=>switchView("summary")}
    ]);
  }

  function normalizeCorrectionCommand(text){
    return normalizeQuickText(text).replace(/[₹,]/g,"").trim();
  }

  async function handleLastCorrection(text){
    const raw = normalizeCorrectionCommand(text);
    const m = raw.match(/^change\s+last\s+(amount|category|payment|date|merchant)\s+to\s+(.+)$/i);
    if(!m) return false;
    const txn = getLastTransaction();
    if(!txn){ addBotMessage("There’s no saved transaction to change yet."); return true; }
    const field = m[1].toLowerCase();
    const value = m[2].trim();
    if(field === "amount"){
      const n = parseAmount(value);
      if(!n){ addBotMessage("I couldn't read that amount. Try: <b>change last amount to 500</b>"); return true; }
      txn.amount=n;
    } else if(field === "category"){
      const wanted = value.toLowerCase();
      const cat = getCategories(txn.type).find(c=>c.toLowerCase()===wanted) || value;
      txn.category=cat;
    } else if(field === "payment"){
      const detected = detectPayment(value);
      const allowed = PAYMENT_METHODS.find(p=>p.toLowerCase()===value.toLowerCase()) || detected;
      if(!allowed){ addBotMessage(`I don't recognize that payment method. Try <b>${PAYMENT_METHODS.join(", ")}</b>.`); return true; }
      txn.payment=allowed;
    } else if(field === "date"){
      const d=parseDate(value);
      if(!d){ addBotMessage("I couldn't read that date. Try <b>8 Sep</b>, <b>8/9</b>, or <b>yesterday</b>."); return true; }
      txn.date=d+"T00:00:00";
    } else if(field === "merchant"){
      txn.merchant=value.toLowerCase();
    }
    await saveTransactions();
    renderBalance();
    addBotMessage(`Updated the last transaction: <b>${escapeHtml(txn.merchant || txn.category)}</b> · ${fmt(txn.amount)}.`);
    addChoices([
      {label:"Undo change",onClick:()=>undoCorrection(txn)},
      {label:"Log another",primary:true,onClick:()=>startFlow()},
      {label:"View summary",onClick:()=>switchView("summary")}
    ]);
    return true;
  }

  async function undoCorrection(txn){
    // A lightweight correction undo: remove the current version and restore the
    // previous snapshot captured when the correction button was created.
    if(!txn || !txn.__beforeCorrection){ addBotMessage("I can only undo the latest change from this message."); return; }
    const snapshot=txn.__beforeCorrection;
    const idx=transactions.findIndex(t=>t.id===txn.id);
    if(idx>=0) transactions[idx]=snapshot;
    await saveTransactions();
    delete snapshot.__beforeCorrection;
    renderBalance();
    addBotMessage("Change undone. The previous values are restored.");
  }

  function openEditLast(){
    const txn=getLastTransaction();
    if(!txn){ addBotMessage("There’s no saved transaction to edit yet."); return; }
    const before=JSON.parse(JSON.stringify(txn));
    const row=document.createElement("div"); row.className="msg-row bot";
    const wrap=document.createElement("div"); wrap.className="input-row";
    const input=document.createElement("input"); input.type="text"; input.placeholder='e.g. "change amount to 500"';
    const btn=document.createElement("button"); btn.className="send"; btn.textContent="Change";
    async function submit(){
      const v=input.value.trim(); if(!v) return;
      input.disabled=true; btn.disabled=true;
      const cmd=v.toLowerCase().startsWith("change last ") ? v : "change last "+v;
      txn.__beforeCorrection=before;
      await handleLastCorrection(cmd);
      delete txn.__beforeCorrection;
    }
    input.addEventListener("keydown",e=>{if(e.key==="Enter")submit()}); btn.onclick=submit;
    wrap.appendChild(input); wrap.appendChild(btn); row.appendChild(wrap); chatLog.appendChild(row); chatLog.scrollTop=chatLog.scrollHeight; input.focus();
  }

  function handleQuickCommand(text){
    if(handleTransactionSearchQuery(text)) return true;
    if(handleAlertQuery(text)) return true;
    if(handleBudgetQuery(text)) return true;
    if(handleInsightQuery(text)) return true;
    if(handleQueryCommand(text)) return true;
    const lower=normalizeQuickText(text).toLowerCase();
    if(/^(undo|undo last|delete last|remove last)$/.test(lower)){
      undoLastTransaction(); return true;
    }
    if(/^change\s+last\s+/.test(lower)){
      handleLastCorrection(text); return true;
    }
    return false;
  }

  function handleQuickInput(text){
    // Search, budget and information queries are completed actions, not
    // transaction-flow steps. Always intercept them before the transaction parser.
    const handledQuery = handleTransactionSearchQuery(text) || handleAlertQuery(text) || handleBudgetQuery(text) || handleInsightQuery(text) || handleQueryCommand(text);
    if(handledQuery){
      setTimeout(()=>{
        if(document.getElementById("chat-view")?.style.display !== "none"){
          renderQuickInput();
        }
      }, 50);
      return;
    }
    const lower=normalizeQuickText(text).toLowerCase();
    if(/^(undo|undo last|delete last|remove last)$/.test(lower)){
      undoLastTransaction();
      renderQuickInput();
      return;
    }
    if(/^change\s+last\s+/.test(lower)){
      handleLastCorrection(text);
      return;
    }
    if(handleCategoryChangeCommand(text)) return;
    const parsed = parseQuickEntry(text);
    flowHistory.push({step:"quick", draft:{}, prefill:text});
    draft = {...parsed, raw:text};
    if(!draft.merchant) draft.merchant = inferMerchant(text);

    if(!draft.amount){
      addBotMessage("I couldn't find an amount. How much was it?");
      addInputRow("e.g. 250 or 1.2k",{
        numeric:true,
        buttonLabel:"Next",
        onSubmit:n=>{
          flowHistory.push({step:"quick",draft:JSON.parse(JSON.stringify(draft))});
          draft.amount=n;
          continueAfterQuick();
        }
      });
      addBackButton();
      return;
    }
    continueAfterQuick();
  }

  function continueAfterQuick(){
    if(!draft.type){
      flowHistory.push({step:"quick",draft:JSON.parse(JSON.stringify(draft)), reason:"type"});
      showTyping(()=>{
        addBotMessage("Is this an expense or income?");
        addChoices([
          {label:"Expense",onClick:()=>{draft.type="Expense";continueAfterQuick();}},
          {label:"Income",onClick:()=>{draft.type="Income";continueAfterQuick();}}
        ]);
        addBackButton();
      });
      return;
    }

    if(!draft.category){
      flowHistory.push({step:"quick",draft:JSON.parse(JSON.stringify(draft)), reason:"category"});
      showTyping(()=>{
        addBotMessage("Which category?");
        addChoices([
          ...getCategories(draft.type).map(c=>({
            label:c,
            onClick:()=>{draft.category=c;continueAfterQuick();}
          })),
          {
            label:"+ Add category",
            primary:true,
            onClick:()=>{
              askForNewCategory(draft.type, (name)=>{
                if(name){
                  draft.category=name;
                  continueAfterQuick();
                }
              });
            }
          }
        ]);
        addBackButton();
      });
      return;
    }

    if(!draft.payment){
      // Ask to remember only once, and only for a genuinely new merchant.
      if(draft.merchant && !draft.merchantWasLearned &&
         !draft.merchantWasBuiltIn && draft.category &&
         draft._rememberDecision !== "no"){
        flowHistory.push({step:"quick",draft:JSON.parse(JSON.stringify(draft)), reason:"remember"});
        showTyping(()=>{
          addBotMessage(`Should I remember <b>${escapeHtml(draft.merchant)}</b> as <b>${escapeHtml(draft.category)}</b> for next time?`);
          addChoices([
            {label:"Yes, remember", primary:true, onClick:()=>{
              rememberMerchant(draft.type,draft.merchant,draft.category);
              draft.merchantWasLearned = true;
              draft._rememberDecision = "yes";
              continueAfterQuick();
            }},
            {label:"No, just this time", onClick:()=>{
              draft._rememberDecision = "no";
              continueAfterQuick();
            }}
          ]);
          addBackButton();
        });
        return;
      }

      flowHistory.push({step:"quick",draft:JSON.parse(JSON.stringify(draft)), reason:"payment"});
      showTyping(()=>{
        addBotMessage("How'd you pay?");
        addChoices(PAYMENT_METHODS.map(p=>({
          label:p,
          onClick:()=>{draft.payment=p;continueAfterQuick();}
        })));
        addBackButton();
      });
      return;
    }

    if(!draft.date) draft.date=todayISO();
    showConfirm();
  }

  // ---------- guided flow ----------
  function pickType(type){
    addUserMessage(type);
    flowHistory.push({step:"type",draft:JSON.parse(JSON.stringify(draft))});
    draft={...draft,type}; step="category";
    showTyping(()=>{
      addBotMessage("Which category?");
      addChoices([
        ...getCategories(type).map(c=>({label:c,onClick:()=>pickCategory(c)})),
        {
          label:"+ Add category",
          primary:true,
          onClick:()=>{
            askForNewCategory(type, (name)=>{
              if(name) pickCategory(name);
            });
          }
        }
      ]);
      addBackButton();
    });
  }

  function pickCategory(cat){
    addUserMessage(cat);
    flowHistory.push({step:"category",draft:JSON.parse(JSON.stringify(draft))});
    draft.category=cat; step="amount";
    showTyping(()=>{
      addInputRow("e.g. 1,250",{numeric:true,buttonLabel:"Next",onSubmit:n=>pickAmount(n)});
      addBackButton();
    });
  }

  function pickAmount(n){
    addUserMessage(fmt(n));
    flowHistory.push({step:"amount",draft:JSON.parse(JSON.stringify(draft))});
    draft.amount=n; step="payment";
    showTyping(()=>{
      addBotMessage("How'd you pay?");
      addChoices(PAYMENT_METHODS.map(p=>({label:p,onClick:()=>pickPayment(p)})));
      addBackButton();
    });
  }

  function pickPayment(p){
    addUserMessage(p);
    flowHistory.push({step:"payment",draft:JSON.parse(JSON.stringify(draft))});
    draft.payment=p; step="date";
    showTyping(()=>{
      addBotMessage("What date should this transaction use?");
      addDateInput(draft.date || todayISO(), d=>pickDate(d));
      addBackButton();
    });
  }

  function pickDate(date){
    addUserMessage(formatDisplayDate(date));
    flowHistory.push({step:"date",draft:JSON.parse(JSON.stringify(draft))});
    draft.date=date; step="note";
    showTyping(()=>{
      addInputRow("Add a note (optional)",{
        buttonLabel:"Add",skippable:true,
        onSubmit:val=>pickNote(val),onSkip:()=>pickNote("")
      });
      addBackButton();
    });
  }

  function pickNote(note){
    if(note) addUserMessage(note);
    flowHistory.push({step:"note",draft:JSON.parse(JSON.stringify(draft))});
    draft.note=note;
    showConfirm();
  }

  function showConfirm(){
    showTyping(() => {
      const card = document.createElement("div");
      card.className = "confirm-card";
      const amtClass = draft.type === "Income" ? "" : "";
      card.innerHTML = `
        <div class="row"><span class="k">Date</span><span class="v">${new Date(draft.date + "T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}</span></div>
        <div class="row"><span class="k">Type</span><span class="v">${draft.type}</span></div>
        <div class="row"><span class="k">Category</span><span class="v">${draft.category}</span></div>
        <div class="row"><span class="k">Amount</span><span class="v">${fmt(draft.amount)}</span></div>
        <div class="row"><span class="k">Payment</span><span class="v">${draft.payment}</span></div>
        ${draft.note ? `<div class="row"><span class="k">Note</span><span class="v">${escapeHtml(draft.note)}</span></div>` : ""}
      `;
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.appendChild(card);
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;

      addChoices([
        { label: "Confirm", primary: true, onClick: () => confirmEntry() },
        { label: "Edit", onClick: () => openEditDraft() },
        { label: "Discard", danger: true, onClick: () => discardEntry() },
      ]);
    });
  }

  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function openEditDraft(){
    addBotMessage('Edit with a command like <b>amount to 500</b>, <b>category to Food</b>, <b>payment to GPay</b>, <b>date to yesterday</b>, or <b>merchant to coffee</b>.');
    const row=document.createElement("div"); row.className="msg-row bot";
    const wrap=document.createElement("div"); wrap.className="input-row";
    const input=document.createElement("input"); input.type="text"; input.placeholder='e.g. "amount to 500"';
    const btn=document.createElement("button"); btn.className="send"; btn.textContent="Update";
    function submit(){
      const v=input.value.trim(); if(!v) return;
      input.disabled=true; btn.disabled=true;
      const m=v.match(/^(?:change\s+)?(amount|category|payment|date|merchant)\s+to\s+(.+)$/i);
      if(!m){
        input.disabled=false; btn.disabled=false; input.focus();
        addBotMessage("Try: <b>amount to 500</b> or <b>change amount to 500</b>.");
        return;
      }
      const field=m[1].toLowerCase(), value=m[2].trim();
      if(field==="amount"){ const n=parseAmount(value); if(!n){ input.disabled=false; btn.disabled=false; input.focus(); addBotMessage("I couldn't read that amount. Try <b>amount to 500</b>."); return;} draft.amount=n; }
      else if(field==="category"){ draft.category=value; }
      else if(field==="payment"){ const p=PAYMENT_METHODS.find(x=>x.toLowerCase()===value.toLowerCase())||detectPayment(value); if(!p){ input.disabled=false; btn.disabled=false; input.focus(); addBotMessage("I don't recognize that payment method. Try <b>payment to GPay</b>."); return;} draft.payment=p; }
      else if(field==="date"){ const d=parseDate(value); if(!d){ input.disabled=false; btn.disabled=false; input.focus(); addBotMessage("I couldn't read that date. Try <b>date to yesterday</b>."); return;} draft.date=d; }
      else if(field==="merchant"){ draft.merchant=value.toLowerCase(); }
      showConfirm();
    }
    input.addEventListener("keydown",e=>{if(e.key==="Enter")submit()}); btn.onclick=submit;
    wrap.appendChild(input); wrap.appendChild(btn); row.appendChild(wrap); chatLog.appendChild(row); chatLog.scrollTop=chatLog.scrollHeight; input.focus();
  }

  async function confirmEntry(){
    const txn = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      type: draft.type,
      category: draft.category,
      merchant: draft.merchant || "",
      amount: draft.amount,
      payment: draft.payment,
      note: draft.note || "",
      date: draft.date ? (draft.date + "T00:00:00") : new Date().toISOString()
    };
    transactions.push(txn);
    lastSavedTransactionId = txn.id;
    await saveTransactions();
    renderBalance();

    showTyping(() => {
      const net = getNet();
      const cls = net >= 0 ? "" : "neg";
      addBotMessage(`Logged. Balance is now <span class="highlight-amt ${cls}">${fmt(net)}</span>.`);
      addChoices([
        { label: "Undo", onClick: () => undoLastTransaction() },
        { label: "Log another", primary: true, onClick: () => startFlow() },
        { label: "View summary", onClick: () => switchView("summary") },
      ]);
    });
  }

  function discardEntry(){
    showTyping(() => {
      addBotMessage("Discarded. Starting over.");
      startFlow();
    });
  }

  // ---------- totals ----------
  function getIncome(){ return transactions.filter(t=>t.type==="Income").reduce((s,t)=>s+t.amount,0); }
  function getExpense(){ return transactions.filter(t=>t.type==="Expense").reduce((s,t)=>s+t.amount,0); }
  function getNet(){ return getIncome() - getExpense(); }

  function renderBalance(){
    const net = getNet();
    headerBalance.textContent = fmt(net);
    headerBalance.style.color = net >= 0 ? "var(--mint)" : "var(--red)";
  }

  // ---------- recurring transactions ----------
  function recurringMonthKey(year, month, ruleId){ return `${ruleId}:${year}-${String(month+1).padStart(2,"0")}`; }

  function daysInMonth(year, month){ return new Date(year, month+1, 0).getDate(); }

  function ensureRecurringTransactions(){
    if(!Array.isArray(recurringRules) || !recurringRules.length) return false;
    const now=new Date(); now.setHours(23,59,59,999);
    let changed=false;
    recurringRules.filter(r=>r.active!==false).forEach(r=>{
      const start = new Date((r.startDate||todayISO())+"T00:00:00");
      const startKey = `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,"0")}`;
      const startMonth = new Date(start.getFullYear(), start.getMonth(), 1);
      const cursor = new Date(startMonth);
      while(cursor <= new Date(now.getFullYear(), now.getMonth(), 1)){
        const y=cursor.getFullYear(), m=cursor.getMonth();
        const day=Math.min(Number(r.dayOfMonth)||1, daysInMonth(y,m));
        const due=new Date(y,m,day); due.setHours(23,59,59,999);
        if(due <= now && due >= start){
          const key=recurringMonthKey(y,m,r.id);
          const exists=transactions.some(t=>t.recurringKey===key);
          if(!exists){
            transactions.push({
              id:"rec_"+key.replace(/[^a-z0-9:-]/gi,"_")+"_"+Math.random().toString(36).slice(2,6),
              type:r.type, category:r.category, merchant:r.merchant||"", amount:Number(r.amount), payment:r.payment||"Other", note:r.note||"Recurring · "+(r.name||r.merchant||r.category),
              date:toDateInputValue(due)+"T00:00:00", recurringKey:key, recurringRuleId:r.id
            });
            changed=true;
          }
        }
        cursor.setMonth(cursor.getMonth()+1);
      }
    });
    if(changed){ saveTransactions(); renderBalance(); }
    return changed;
  }

  function addRecurringRule(rule){
    const clean={...rule,id:"rr_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),active:true,dayOfMonth:Math.max(1,Math.min(31,Number(rule.dayOfMonth)||1)),startDate:rule.startDate||todayISO()};
    recurringRules.push(clean); saveRecurringRules(); ensureRecurringTransactions(); renderSummary();
    return clean;
  }

  function removeRecurringRule(id){
    const rule=recurringRules.find(r=>r.id===id); if(!rule) return;
    rule.active=false; saveRecurringRules(); renderSummary();
  }

  function dateLabelForQuery(date){ return new Date(date+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }

  function monthKeyFromOffset(offset){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+offset); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }

  function monthLabelFromKey(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}); }

  function queryMonthTransactions(key){ return transactions.filter(t=>txnDateKey(t).startsWith(key)); }

  // ---------- natural queries / dashboard helpers ----------
  function localDateKey(date=new Date()){
    const y=date.getFullYear();
    const m=String(date.getMonth()+1).padStart(2,"0");
    const d=String(date.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }

  function txnDateKey(t){
    return String(t.date||"").split("T")[0];
  }

  function currentMonthKey(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }

  function currentMonthTransactions(){
    const key=currentMonthKey();
    return transactions.filter(t=>txnDateKey(t).startsWith(key));
  }

  function formatCategoryList(items){
    const entries=Object.entries(items).sort((a,b)=>b[1]-a[1]);
    if(!entries.length) return "Nothing logged yet.";
    return entries.slice(0,6).map(([name,amount])=>`<b>${escapeHtml(name)}</b> · ${fmt(amount)}`).join("<br>");
  }

  function monthName(){
    return new Date().toLocaleDateString(undefined,{month:"long",year:"numeric"});
  }

  // ---------- transaction search / filter ----------
  function normalizeSearchValue(v){ return normalizeQuickText(v).toLowerCase(); }

  function transactionMatchesSearch(t, filters){
    const merchant=normalizeSearchValue(t.merchant||"");
    const category=normalizeSearchValue(t.category||"");
    const payment=normalizeSearchValue(t.payment||"");
    const note=normalizeSearchValue(t.note||"");
    const haystack=[merchant,category,payment,note].join(" ");
    if(filters.term && !haystack.includes(filters.term)) return false;
    if(filters.type && t.type!==filters.type) return false;
    if(filters.category && category!==filters.category) return false;
    if(filters.payment && payment!==filters.payment) return false;
    if(filters.date && txnDateKey(t)!==filters.date) return false;
    if(filters.month && !txnDateKey(t).startsWith(filters.month)) return false;
    if(filters.minAmount!=null && Number(t.amount||0)<filters.minAmount) return false;
    if(filters.maxAmount!=null && Number(t.amount||0)>filters.maxAmount) return false;
    return true;
  }

  function formatSearchResult(t){
    const date=txnDateKey(t);
    return `${t.type==="Income"?"+":"-"}${fmt(t.amount)} · <b>${escapeHtml(t.merchant||t.category||"Uncategorized")}</b> · ${escapeHtml(t.category||"Uncategorized")} · ${escapeHtml(t.payment||"—")} · ${escapeHtml(date)}`;
  }

  function renderSearchResults(items, label="Matching transactions"){
    if(!items.length){ addBotMessage(`No transactions found${label?` for <b>${escapeHtml(label)}</b>`:""}.`); return; }
    const total=items.reduce((s,t)=>s+Number(t.amount||0),0);
    const expenses=items.filter(t=>t.type==="Expense").reduce((s,t)=>s+Number(t.amount||0),0);
    const income=items.filter(t=>t.type==="Income").reduce((s,t)=>s+Number(t.amount||0),0);
    addBotMessage(`<b>${items.length}</b> matching transaction${items.length===1?"":"s"}. ${expenses?`Expenses: <span class="highlight-amt">${fmt(expenses)}</span>. `:""}${income?`Income: <span class="highlight-amt">${fmt(income)}</span>.`:""}`);
    addBotMessage(items.slice().sort((a,b)=>txnDateKey(b).localeCompare(txnDateKey(a))).slice(0,20).map(formatSearchResult).join("<br>"));
    if(items.length>20) addBotMessage(`Showing the latest 20 of ${items.length} matches. Use Summary → Transaction Search for the full filtered list.`);
  }

  function handleTransactionSearchQuery(text){
    const lower=normalizeSearchValue(text);
    let m;

    // "show all swiggy transactions", "list uber expenses", "show my food expenses"
    m=lower.match(/^(?:show|list|find)(?: all| my)?\s+(.+?)\s+(transactions|expenses|spending|purchases)\??$/);
    if(m){
      const target=m[1].trim();
      const exactCat=getCategories("Expense").find(c=>c.toLowerCase()===target);
      const items=transactions.filter(t=>transactionMatchesSearch(t,{term:exactCat?"":target,category:exactCat?exactCat.toLowerCase():"",type:(m[2]==="expenses"||m[2]==="spending"||m[2]==="purchases")?"Expense":""}));
      renderSearchResults(items,target); return true;
    }

    // "show transactions using paytm/gpay/cash"
    m=lower.match(/^(?:show|list|find)(?: all| my)?\s+(?:transactions|expenses)\s+(?:using|via|with)\s+(.+?)\??$/);
    if(m){
      const detected=detectPayment(m[1]);
      const payment=(detected||m[1]).toLowerCase();
      const items=transactions.filter(t=>normalizeSearchValue(t.payment)===payment);
      renderSearchResults(items,`payment ${payment}`); return true;
    }

    // "show expenses above 1000", "transactions over 5k"
    m=lower.match(/^(?:show|list|find)(?: all| my)?\s+(expenses|transactions)\s+(?:above|over|greater than|more than)\s+(.+?)\??$/);
    if(m){
      const n=parseAmount(m[2]);
      if(!n){ addBotMessage("I couldn't read that amount. Try <b>show expenses above 1000</b>."); return true; }
      const items=transactions.filter(t=>(m[1]==="expenses"?t.type==="Expense":true) && Number(t.amount||0)>n);
      renderSearchResults(items,`${m[1]} above ${fmt(n)}`); return true;
    }

    // "show expenses between 500 and 2000"
    m=lower.match(/^(?:show|list|find)(?: all| my)?\s+(expenses|transactions)\s+between\s+(.+?)\s+and\s+(.+?)\??$/);
    if(m){
      const a=parseAmount(m[2]), b=parseAmount(m[3]);
      if(!a || !b){ addBotMessage("I couldn't read that range. Try <b>show expenses between 500 and 2000</b>."); return true; }
      const lo=Math.min(a,b), hi=Math.max(a,b);
      const items=transactions.filter(t=>(m[1]==="expenses"?t.type==="Expense":true) && Number(t.amount||0)>=lo && Number(t.amount||0)<=hi);
      renderSearchResults(items,`${fmt(lo)}–${fmt(hi)}`); return true;
    }

    // "show transactions on yesterday / 8 sep" is already handled by the date query,
    // but this supports "show all transactions" as a useful catch-all.
    if(/^(?:show|list|find)(?: all| my)?\s+(?:transactions|expenses)\??$/.test(lower)){
      const type=/expenses/.test(lower)?"Expense":"";
      renderSearchResults(transactions.filter(t=>!type||t.type===type),type||"all transactions"); return true;
    }
    return false;
  }

  function handleQueryCommand(text){
    const raw=normalizeQuickText(text).trim();
    const lower=raw.toLowerCase();

    // Date / month queries
    let dm = lower.match(/^(?:how much did i spend|how much have i spent|what did i spend|what have i spent)(?: (?:on|in))? (.+?)\??$/);
    if(dm){
      const target=dm[1].trim();
      let date=parseDate(target);
      if(date){
        const tx=transactions.filter(t=>t.type==="Expense" && txnDateKey(t)===date);
        const total=tx.reduce((s,t)=>s+Number(t.amount||0),0);
        addBotMessage(`You spent <span class="highlight-amt">${fmt(total)}</span> on <b>${escapeHtml(dateLabelForQuery(date))}</b>.`);
        addChoices([{label:"View summary",primary:true,onClick:()=>switchView("summary")}]);
        return true;
      }
      let mk=null;
      if(/^(?:last month)$/.test(target)) mk=monthKeyFromOffset(-1);
      else if(/^(?:this month|current month)$/.test(target)) mk=monthKeyFromOffset(0);
      else {
        const mm=target.match(/^(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)(?:\s+(\d{4}))?$/);
        if(mm){ const months={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11}; const y=mm[2]?Number(mm[2]):new Date().getFullYear(); mk=`${y}-${String(months[mm[1]]+1).padStart(2,"0")}`; }
      }
      if(mk){ const total=queryMonthTransactions(mk).filter(t=>t.type==="Expense").reduce((s,t)=>s+Number(t.amount||0),0); addBotMessage(`You spent <span class="highlight-amt">${fmt(total)}</span> in <b>${escapeHtml(monthLabelFromKey(mk))}</b>.`); addChoices([{label:"View summary",primary:true,onClick:()=>switchView("summary")}]); return true; }
    }

    if(/^(?:show|list) (?:my )?(?:transactions|expenses) (?:on|for) (.+?)\??$/.test(lower)){
      const m2=lower.match(/^(?:show|list) (?:my )?(?:transactions|expenses) (?:on|for) (.+?)\??$/);
      const date=parseDate(m2[1].trim());
      if(date){ const tx=transactions.filter(t=>txnDateKey(t)===date); if(!tx.length) addBotMessage(`No transactions found on <b>${escapeHtml(dateLabelForQuery(date))}</b>.`); else addBotMessage(tx.map(t=>`${t.type==="Income"?"+":"-"}${fmt(t.amount)} · <b>${escapeHtml(t.merchant||t.category)}</b> · ${escapeHtml(t.category)} · ${escapeHtml(t.payment)}`).join("<br>")); return true; }
    }

    if(/^(?:what|which) (?:recurring|recurring transactions|bills) do i have\??$/.test(lower) || /^(?:show|list) recurring(?: transactions| bills)?\??$/.test(lower)){
      const active=recurringRules.filter(r=>r.active!==false); if(!active.length) addBotMessage("You don't have any recurring transactions yet. Add one from Summary → Recurring transactions."); else addBotMessage(active.map(r=>`<b>${escapeHtml(r.name||r.merchant||r.category)}</b> · ${fmt(r.amount)} · monthly on the ${r.dayOfMonth}${[1,21,31].includes(Number(r.dayOfMonth))?'st':[2,22].includes(Number(r.dayOfMonth))?'nd':[3,23].includes(Number(r.dayOfMonth))?'rd':'th'}`).join("<br>")); return true;
    }

    // Balance / totals
    if(/^(what(?:'s| is) )?(my )?balance\??$/.test(lower) || /^balance\??$/.test(lower)){
      addBotMessage(`Your current balance is <span class="highlight-amt ${getNet()<0?'neg':''}">${fmt(getNet())}</span>.`);
      return true;
    }

    // Spending insight queries must be handled before transaction parsing.
    if (/^(?:what is|what's|which is|which) (?:my )?(?:the )?(?:most spent|highest spending|top spending) category\??$/.test(lower) ||
        /^(?:what category did i spend (?:the )?most on|where did i spend (?:the )?most)\??$/.test(lower) ||
        /^(?:most spent category|top spending category|highest spending category)\??$/.test(lower)) {
      const mt = currentMonthTransactions().filter(t=>t.type==="Expense");
      const totals = {};
      mt.forEach(t=>{ const c=String(t.category||"Uncategorized"); totals[c]=(totals[c]||0)+Number(t.amount||0); });
      const top = Object.entries(totals).sort((a,b)=>b[1]-a[1])[0];
      if(!top) addBotMessage(`No expenses recorded in ${monthName()} yet.`);
      else addBotMessage(`Your highest spending category this month is <b>${escapeHtml(top[0])}</b> at <span class="highlight-amt">${fmt(top[1])}</span>.`);
      return true;
    }

    const monthMatch=lower.match(/^(?:how much|what) (?:did i|have i) (spend|spent|earn|earned)(?: this month)?\??$/);
    if(monthMatch){
      const mt=currentMonthTransactions();
      const amount=monthMatch[1].startsWith("spend") ? mt.filter(t=>t.type==="Expense").reduce((s,t)=>s+t.amount,0) : mt.filter(t=>t.type==="Income").reduce((s,t)=>s+t.amount,0);
      const label=monthMatch[1].startsWith("spend")?"spending":"income";
      addBotMessage(`You have ${label} <span class="highlight-amt">${fmt(amount)}</span> in ${monthName()}.`);
      return true;
    }

    if(/^(?:how much|what) did i spend this month\??$/.test(lower) || /^expenses this month\??$/.test(lower)){
      const amount=currentMonthTransactions().filter(t=>t.type==="Expense").reduce((s,t)=>s+t.amount,0);
      addBotMessage(`You've spent <span class="highlight-amt">${fmt(amount)}</span> in ${monthName()}.`);
      return true;
    }

    if(/^(?:how much|what) did i earn this month\??$/.test(lower) || /^income this month\??$/.test(lower)){
      const amount=currentMonthTransactions().filter(t=>t.type==="Income").reduce((s,t)=>s+t.amount,0);
      addBotMessage(`You've received <span class="highlight-amt">${fmt(amount)}</span> in ${monthName()}.`);
      return true;
    }

    // Category / merchant queries. We intentionally require "spend" or "spent"
    // so ordinary transaction phrases don't get intercepted.
    let m=lower.match(/^how much (?:did i|have i) spend(?:t)? on (.+?)(?: this month)?\??$/);
    if(m){
      const target=m[1].trim();
      const mt=currentMonthTransactions().filter(t=>t.type==="Expense");
      const exactCat=getCategories("Expense").find(c=>c.toLowerCase()===target);
      const total=mt.filter(t=>{
        const merchant=String(t.merchant||"").toLowerCase();
        return exactCat ? t.category.toLowerCase()===exactCat.toLowerCase() : merchant===target;
      }).reduce((s,t)=>s+t.amount,0);
      const label=exactCat||target;
      addBotMessage(`You've spent <span class="highlight-amt">${fmt(total)}</span> on <b>${escapeHtml(label)}</b> in ${monthName()}.`);
      return true;
    }

    m=lower.match(/^show (?:my )?(?:expenses|spending) (?:for|on) (.+?)(?: this month)?\??$/);
    if(m){
      const target=m[1].trim();
      const exactCat=getCategories("Expense").find(c=>c.toLowerCase()===target);
      const mt=currentMonthTransactions().filter(t=>t.type==="Expense").filter(t=>exactCat ? t.category.toLowerCase()===exactCat.toLowerCase() : String(t.merchant||"").toLowerCase()===target);
      if(!mt.length){ addBotMessage(`No ${exactCat||escapeHtml(target)} expenses found in ${monthName()}.`); return true; }
      const total=mt.reduce((s,t)=>s+t.amount,0);
      addBotMessage(`<b>${escapeHtml(exactCat||target)}</b>: ${fmt(total)} across ${mt.length} transaction${mt.length===1?'':'s'}.`);
      addChoices([{label:"View summary",primary:true,onClick:()=>switchView("summary")}]);
      return true;
    }

    if(/^(?:summary|dashboard|show summary|show dashboard)$/.test(lower)){
      // Navigation command: switch views directly and defensively.
      // Do not depend on the chat flow after this command.
      try {
        tabSummary.classList.add("active");
        tabChat.classList.remove("active");
        chatViewEl.style.display = "none";
        summaryViewEl.style.display = "block";
        renderSummary();
      } catch(e) {
        console.error("Dashboard navigation error", e);
        // If dashboard rendering ever fails, keep the assistant usable.
        chatViewEl.style.display = "flex";
        summaryViewEl.style.display = "none";
        addBotMessage("I couldn't open the dashboard. Please tap Summary at the top.");
        renderQuickInput();
      }
      return true;
    }

    if(/^(?:recent|recent transactions|show recent transactions)$/.test(lower)){
      const recent=[...transactions].reverse().slice(0,5);
      if(!recent.length){ addBotMessage("No transactions logged yet."); return true; }
      addBotMessage(recent.map(t=>`${t.type==="Income"?"+":"-"}${fmt(t.amount)} · <b>${escapeHtml(t.merchant||t.category)}</b> · ${escapeHtml(t.category)}`).join("<br>"));
      return true;
    }

    return false;
  }

  // ---------- budgets & analytics ----------
  function monthKeyOffset(offset){
    const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+offset);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }

  function monthLabelFromKey(key){
    const [y,m]=key.split("-").map(Number);
    return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"short"});
  }

  function monthExpenseTotal(key){
    return transactions.filter(t=>t.type==="Expense" && txnDateKey(t).startsWith(key)).reduce((s,t)=>s+Number(t.amount||0),0);
  }

  function categoryMonthTotal(category,key){
    return transactions.filter(t=>t.type==="Expense" && txnDateKey(t).startsWith(key) && String(t.category||"").toLowerCase()===String(category).toLowerCase()).reduce((s,t)=>s+Number(t.amount||0),0);
  }

  function budgetStatus(category){
    const limit=Number(budgets.Expense?.[category]||0);
    if(!limit) return null;
    const spent=categoryMonthTotal(category,currentMonthKey());
    return {limit,spent,remaining:limit-spent,pct:Math.min(100,(spent/limit)*100)};
  }

  function handleBudgetQuery(text){
    const lower=normalizeQuickText(text).toLowerCase();
    if(/^(?:show|view) budgets?$/.test(lower) || /^my budgets?$/.test(lower)) {
      const entries=Object.entries(budgets.Expense||{}).filter(([,v])=>Number(v)>0);
      if(!entries.length){ addBotMessage("You don't have any category budgets yet. Add them from Summary → Budgets."); }
      else addBotMessage(entries.map(([c,v])=>{const st=budgetStatus(c); return `<b>${escapeHtml(c)}</b> · ${fmt(st.spent)} / ${fmt(st.limit)}${st.spent>st.limit?" · <b>over budget</b>":""}`;}).join("<br>"));
      return true;
    }
    let m=lower.match(/^how much (?:can i|do i have left to) spend on (.+?)(?: this month)?\??$/);
    if(m){
      const target=m[1].trim();
      const cat=getCategories("Expense").find(c=>c.toLowerCase()===target);
      if(!cat || !budgets.Expense?.[cat]) { addBotMessage(`I don't have a budget set for <b>${escapeHtml(cat||target)}</b> yet.`); return true; }
      const st=budgetStatus(cat);
      addBotMessage(st.remaining>=0 ? `You have <span class="highlight-amt">${fmt(st.remaining)}</span> left for <b>${escapeHtml(cat)}</b> this month.` : `<b>${escapeHtml(cat)}</b> is <span class="highlight-amt">${fmt(Math.abs(st.remaining))}</span> over budget this month.`);
      return true;
    }
    m=lower.match(/^(?:am i|are we) over budget(?: on (.+?))?\??$/);
    if(m){
      const target=m[1]?.trim();
      const entries=Object.entries(budgets.Expense||{}).filter(([,v])=>Number(v)>0).map(([c])=>[c,budgetStatus(c)]).filter(([,st])=>st && st.spent>st.limit);
      if(target){ const cat=getCategories("Expense").find(c=>c.toLowerCase()===target); const st=cat?budgetStatus(cat):null; addBotMessage(st ? (st.spent>st.limit ? `<b>${escapeHtml(cat)}</b> is over budget by <span class="highlight-amt">${fmt(st.spent-st.limit)}</span>.` : `<b>${escapeHtml(cat)}</b> is within budget.`) : `I don't have a budget for <b>${escapeHtml(target)}</b>.`); }
      else addBotMessage(entries.length ? `You're over budget in <b>${escapeHtml(entries[0][0])}</b>${entries.length>1?` and ${entries.length-1} other categor${entries.length-1===1?'y':'ies'}`:""}.` : "You're within all your set category budgets this month.");
      return true;
    }
    if(/^(?:compare|comparison) (?:this month|monthly spending|spending)$/.test(lower) || /^how does this month compare$/.test(lower)){
      const cur=monthExpenseTotal(currentMonthKey()), prev=monthExpenseTotal(monthKeyOffset(-1));
      const diff=cur-prev; const pct=prev?Math.abs(diff/prev*100):null;
      addBotMessage(prev ? `This month you've spent <span class="highlight-amt">${fmt(cur)}</span> vs <span class="highlight-amt">${fmt(prev)}</span> last month — ${diff>=0?"up":"down"} ${fmt(Math.abs(diff))}${pct!==null?` (${pct.toFixed(1)}%)`:""}.` : `You've spent <span class="highlight-amt">${fmt(cur)}</span> this month. There isn't enough data for a month-to-month comparison yet.`);
      return true;
    }
    return false;
  }

  // ---------- alerts ----------
  const ALERTS_KEY = "ledger:alerts:dismissed:v1";
  let dismissedAlerts = {};
  try { dismissedAlerts = JSON.parse(localStorage.getItem(ALERTS_KEY) || "{}"); } catch(e) { dismissedAlerts = {}; }
  function saveDismissedAlerts(){ try{ localStorage.setItem(ALERTS_KEY, JSON.stringify(dismissedAlerts)); }catch(e){} }

  function getLedgerAlerts(){
    const alerts=[];
    const today=new Date(); today.setHours(0,0,0,0);
    const curKey=currentMonthKey(), prevKey=monthKeyOffset(-1);
    // Alerts are intentionally NOT a second budget view: only notify when a budget is crossed.
    Object.entries(budgets.Expense||{}).forEach(([cat,limit])=>{
      const st=budgetStatus(cat); if(!st) return;
      if(st.spent>st.limit) alerts.push({id:`budget-over:${curKey}:${cat}`,type:"warning",title:`${cat} is over budget`,body:`You've spent ${fmt(st.spent)} against a ${fmt(st.limit)} budget — ${fmt(st.spent-st.limit)} over.`});
    });
    // Upcoming recurring payments are useful even when no budget exists.
    recurringRules.filter(r=>r.active!==false).forEach(r=>{
      const day=Math.min(31,Math.max(1,Number(r.dayOfMonth)||1));
      const y=today.getFullYear(), m=today.getMonth();
      let due=new Date(y,m,day); if(due<today) due=new Date(y,m+1,day);
      const diff=Math.round((due-today)/86400000);
      if(diff>=0 && diff<=3){
        const label=diff===0?"due today":diff===1?"due tomorrow":`due in ${diff} days`;
        alerts.push({id:`recurring:${r.id}:${due.getFullYear()}-${due.getMonth()+1}`,type:"info",title:`${r.name||r.merchant||r.category} ${label}`,body:`${fmt(r.amount)} · ${r.category||"Recurring payment"}`});
      }
    });
    // Spending pace alert is independent of budgets.
    const cur=monthExpenseTotal(curKey), prev=monthExpenseTotal(prevKey);
    const now=new Date(); const daysElapsed=now.getDate();
    if(prev>0 && daysElapsed>1){
      const prevDays=new Date(now.getFullYear(),now.getMonth(),0).getDate();
      const curDaily=cur/daysElapsed, prevDaily=prev/prevDays;
      if(prevDaily>0 && curDaily>=prevDaily*1.2){
        const pct=((curDaily/prevDaily)-1)*100;
        alerts.push({id:`pace:${curKey}`,type:"warning",title:"Spending pace is higher than usual",body:`You're spending about ${pct.toFixed(0)}% faster per day than last month.`});
      }
    }
    return alerts;
  }

  function handleAlertQuery(text){

    if(/^(?:show|view|check) alerts?$/.test(lower) || /^what should i watch\??$/.test(lower)){
      const alerts=getLedgerAlerts().filter(a=>!dismissedAlerts[a.id]);
      switchView("summary");
      addBotMessage(alerts.length ? alerts.map(a=>`<b>${escapeHtml(a.title)}</b> · ${escapeHtml(a.body)}`).join("<br>") : "Nothing needs your attention right now.");
      return true;
    }
    if(/^(?:any|are there any) upcoming (?:payments|recurring payments)\??$/.test(lower) || /^what recurring payments are coming up\??$/.test(lower)){
      const upcoming=getLedgerAlerts().filter(a=>a.id.startsWith("recurring:") && !dismissedAlerts[a.id]);
      addBotMessage(upcoming.length ? upcoming.map(a=>`<b>${escapeHtml(a.title)}</b> · ${escapeHtml(a.body)}`).join("<br>") : "No recurring payments are due within the next 3 days.");
      return true;
    }
    if(/^am i spending more than usual\??$/.test(lower)){

      addBotMessage(pace ? `<b>${escapeHtml(pace.title)}</b> — ${escapeHtml(pace.body)}` : "Your current spending pace isn't unusually high compared with last month.");

  function getInsightDayTotals(key=currentMonthKey()){
    const totals={};
    transactions.filter(t=>t.type==="Expense" && txnDateKey(t).startsWith(key))
      .forEach(t=>{const d=txnDateKey(t); totals[d]=(totals[d]||0)+Number(t.amount||0);});
    return totals;
  }

  function renderInsightsManager(){
    const section=document.createElement("div");
    section.className="summary-section";
    section.innerHTML=`<h2>Smart Insights</h2><div id="insights-grid" class="insights-grid"></div>`;
    summaryContent.appendChild(section);
    const grid=section.querySelector("#insights-grid");

    const mt=currentMonthTransactions();
    const exp=mt.filter(t=>t.type==="Expense");
    const inc=mt.filter(t=>t.type==="Income");
    const spent=exp.reduce((s,t)=>s+Number(t.amount||0),0);
    const income=inc.reduce((s,t)=>s+Number(t.amount||0),0);
    const cats={};
    exp.forEach(t=>{const c=String(t.category||"Uncategorized");cats[c]=(cats[c]||0)+Number(t.amount||0);});
    const days=getInsightDayTotals();
    const topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
    const topTxn=[...exp].sort((a,b)=>Number(b.amount||0)-Number(a.amount||0))[0];
    const topDay=Object.entries(days).sort((a,b)=>b[1]-a[1])[0];
    const avg=exp.length?spent/exp.length:0;
    const prev=monthExpenseTotal(monthKeyOffset(-1));
    const change=prev?((spent-prev)/prev*100):null;
    const rate=income?((income-spent)/income*100):null;
    const over=Object.entries(budgets.Expense||{}).filter(([,v])=>Number(v)>0)
      .map(([c])=>[c,budgetStatus(c)]).filter(([,s])=>s&&s.spent>s.limit);

    const card=(label,value,note="")=>`<div class="insight-card"><div class="insight-label">${label}</div><div class="insight-value">${value}</div>${note?`<div class="insight-note">${note}</div>`:""}</div>`;
    grid.innerHTML=[
      card("Average expense",fmt(avg),`${exp.length} expense${exp.length===1?"":"s"} this month`),
      card("Largest expense",topTxn?fmt(topTxn.amount):"—",topTxn?escapeHtml(topTxn.merchant||topTxn.category||"Uncategorized"):"No expenses yet"),
      card("Top category",topCat?escapeHtml(topCat[0]):"—",topCat?fmt(topCat[1]):"No expenses yet"),
      card("Highest-spend day",topDay?fmt(topDay[1]):"—",topDay?escapeHtml(topDay[0]):"No expenses yet"),
      card("Savings rate",rate!==null?`${rate.toFixed(1)}%`:"—",income?`${fmt(income-spent)} net this month`:"Add income to calculate"),
      card("vs last month",change!==null?`${change>=0?"+":""}${change.toFixed(1)}%`:"—",prev?`${change>=0?"Higher":"Lower"} spending`:"No previous-month spending")
    ].join("");

  function handleInsightQuery(text){
    const lower=normalizeQuickText(text).toLowerCase();

    if(/^(?:what|which) (?:was|is) my (?:biggest|largest) expense(?: this month)?\??$/.test(lower) ||
       /^what did i spend the most on(?: this month)?\??$/.test(lower)){
      const exp=currentMonthTransactions().filter(t=>t.type==="Expense").sort((a,b)=>Number(b.amount||0)-Number(a.amount||0));
      addBotMessage(exp.length?`Your biggest expense this month was <b>${escapeHtml(exp[0].merchant||exp[0].category||"Uncategorized")}</b> at <span class="highlight-amt">${fmt(exp[0].amount)}</span>.`:`No expenses recorded in ${monthName()} yet.`);
      return true;
    }

    if(/^(?:what is|what's) my average expense(?: this month)?\??$/.test(lower)){
      const exp=currentMonthTransactions().filter(t=>t.type==="Expense");
      const total=exp.reduce((s,t)=>s+Number(t.amount||0),0);
      addBotMessage(exp.length?`Your average expense this month is <span class="highlight-amt">${fmt(total/exp.length)}</span>.`:`No expenses recorded in ${monthName()} yet.`);
      return true;
    }

    if(/^(?:what is|what's) my savings rate(?: this month)?\??$/.test(lower) ||
       /^how much am i saving(?: this month)?\??$/.test(lower)){
      const mt=currentMonthTransactions();
      const income=mt.filter(t=>t.type==="Income").reduce((s,t)=>s+Number(t.amount||0),0);
      const spent=mt.filter(t=>t.type==="Expense").reduce((s,t)=>s+Number(t.amount||0),0);
      if(!income) addBotMessage("I need at least one income transaction this month to calculate your savings rate.");
      else { const rate=(income-spent)/income*100; addBotMessage(`Your savings rate this month is <span class="highlight-amt">${rate.toFixed(1)}%</span>. You've kept <span class="highlight-amt">${fmt(income-spent)}</span> from ${fmt(income)} of income.`); }
      return true;
    }

    if(/^(?:what|which) day did i spend the most(?: this month)?\??$/.test(lower) ||
       /^what was my highest spending day(?: this month)?\??$/.test(lower)){
      const top=Object.entries(getInsightDayTotals()).sort((a,b)=>b[1]-a[1])[0];
      addBotMessage(top?`Your highest-spending day this month was <b>${escapeHtml(top[0])}</b> at <span class="highlight-amt">${fmt(top[1])}</span>.`:`No expenses recorded in ${monthName()} yet.`);
      return true;
    }

    if(/^(?:show|view) smart insights?$/.test(lower)){
      switchView("summary");
      addBotMessage("I've opened Summary. Scroll to <b>Smart Insights</b> for the latest spending signals.");
      return true;
    }
    return false;
  }

      };

      const total=items.reduce((sum,t)=>sum+Number(t.amount||0),0);
      result.innerHTML=items.length ? `

            </div>
            <div class="search-result-amt ${t.type.toLowerCase()}">${t.type==="Income"?"+":"-"}${fmt(t.amount)}</div>
            <button class="txn-edit" data-id="${escapeHtml(t.id)}" title="Edit">Edit</button>

          </div>`).join("")}` : "<div class='empty-note'>No matching transactions.</div>";

      result.querySelectorAll(".txn-edit").forEach(btn=>{
        btn.onclick=()=>openTransactionEditor(btn.getAttribute("data-id"),render);
      });
      result.querySelectorAll(".txn-del").forEach(btn=>{
        btn.onclick=async()=>{
          const id=btn.getAttribute("data-id");
          const txn=transactions.find(t=>t.id===id);
          if(!txn) return;
          if(!confirm(`Delete ${txn.merchant||txn.category||"this transaction"} · ${fmt(txn.amount)}?`)) return;
          transactions=transactions.filter(t=>t.id!==id);
          if(lastSavedTransactionId===id) lastSavedTransactionId=transactions.length ? transactions[transactions.length-1].id : null;
          await saveTransactions();
          renderBalance();
          render();
        };
      });
    }

    section.querySelector("#txn-search-apply").onclick=render;
    section.querySelector("#txn-search-clear").onclick=()=>{
      section.querySelectorAll("input").forEach(i=>i.value="");
      q("#txn-search-type").value="";
      q("#txn-search-category").value="";
      q("#txn-search-payment").value="";
      render();
    };

    section.querySelectorAll("input,select").forEach(el=>{
      el.addEventListener("keydown",e=>{if(e.key==="Enter") render();});
    });
    render();
  }

  async function exportBackup(){
    const data = getBackupText();
    const filename = `ledger-backup-${new Date().toISOString().slice(0,10)}.json`;
    const file = new File([data], filename, {type:"application/json"});

    // Best option on supported desktop browsers: native Save As dialog.
    try{
      if(window.showSaveFilePicker){
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types:[{
            description:"Ledger Backup",
            accept:{"application/json":[".json"]}
          }]
        });
        const writable = await handle.createWritable();
        await writable.write(data);
        await writable.close();
        showBackupMessage("Backup saved successfully.");
        return;
      }
    }catch(err){
      // User cancellation should not be treated as an error.
      if(err && err.name === "AbortError"){
        showBackupMessage("Backup save cancelled.");
        return;
      }
      console.warn("Save picker unavailable:", err);
    }

    // Mobile-friendly share sheet when available.
    try{
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({
          title:"Ledger Backup",
          text:"Ledger backup",
          files:[file]
        });
        showBackupMessage("Backup shared/saved successfully.");
        return;
      }
    }catch(err){
      if(err && err.name === "AbortError"){
        showBackupMessage("Backup save cancelled.");
        return;
      }
      console.warn("Share failed:", err);
    }

    // Normal download fallback.
    try{
      const blob = new Blob([data], {type:"application/json;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
      showBackupMessage("Backup download started. Check your Downloads folder.");
      return;
    }catch(err){
      console.warn("Blob download failed:", err);
    }

    // Last-resort: keep the working copy-to-clipboard route available.
    await copyBackup();
  }

  function showBackupMessage(message){
    const el = document.getElementById("backup-status");
    if(el) el.textContent = message;
  }

  async function copyBackup(){
    const data = getBackupText();
    try{
      await navigator.clipboard.writeText(data);
      showBackupMessage("Backup copied to clipboard. Paste it into a file named ledger-backup.json.");
    }catch(err){
      // Clipboard may be unavailable for local HTML files. Show the backup in
      // a temporary textarea so the user can manually copy it.
      const box = document.getElementById("backup-copy-box");
      if(box){
        box.value = data;
        box.style.display = "block";
        box.focus();
        box.select();
        showBackupMessage("Clipboard access is blocked here. The backup text is selected below — copy it manually.");
      }
    }
  }

  function importBackupFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const parsed = JSON.parse(e.target.result);
        const imported = Array.isArray(parsed) ? parsed : parsed.transactions;
        if(!Array.isArray(imported)) throw new Error("Invalid backup");

        const valid = imported.filter(t =>
          t && t.id && (t.type==="Income" || t.type==="Expense") &&
          typeof t.amount==="number" && typeof t.category==="string"
        );
        if(valid.length !== imported.length) throw new Error("Invalid transaction data");

        transactions = valid;

        if(!Array.isArray(parsed)){
          if(parsed.customCategories &&
             Array.isArray(parsed.customCategories.Expense) &&
             Array.isArray(parsed.customCategories.Income)){
            customCategories = parsed.customCategories;
            saveCustomCategories();
          }
          if(parsed.merchantMemory &&
             parsed.merchantMemory.Expense &&
             parsed.merchantMemory.Income){
            merchantMemory = parsed.merchantMemory;
            saveMerchantMemory();
          }
          if(parsed.budgets && parsed.budgets.Expense && typeof parsed.budgets.Expense === "object") {
            budgets = parsed.budgets;
            saveBudgets();
          }
        }

        saveTransactions();
        renderBalance();
        renderSummary();
        addBotMessage(`Imported ${transactions.length} transaction${transactions.length===1?'':'s'} successfully.`);
      }catch(err){
        console.error(err);
        addBotMessage("That backup file isn't valid.");
      }
    };
    reader.readAsText(file);
  }

  function askForNewCategory(type, afterCreate){
    addBotMessage(`Type the new ${type.toLowerCase()} category name.`);
    addInputRow(`e.g. Coffee, Bike Maintenance`, {
      buttonLabel:"Add",
      onSubmit:(name)=>{
        const clean=String(name||"").trim();
        if(!clean){
          addBotMessage("Please enter a category name.");
          askForNewCategory(type, afterCreate);
          return;
        }
        if(addCustomCategory(type, clean)){
          addBotMessage(`Added <b>${escapeHtml(clean)}</b> to your ${type.toLowerCase()} categories.`);
          afterCreate(clean);
        }else{
          addBotMessage("That category already exists.");
          afterCreate(null);
        }
      }
    });
    addBackButton();
  }

        <div class="input-row" style="flex-wrap:wrap;margin-top:8px;">
          <select id="rr-category" style="flex:1;min-width:150px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;">${catOptions}</select>
          <select id="rr-payment" style="flex:1;min-width:140px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;">${PAYMENT_METHODS.map(p=>`<option>${escapeHtml(p)}</option>`).join("")}</select>
          <input id="rr-day" type="number" min="1" max="31" value="1" style="width:80px;" title="Day of month">
